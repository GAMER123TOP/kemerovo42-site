<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кемерово 42 | Главные новости</title>
    <meta property="og:title" content="КЕМЕРОВО 42 — Официальный новостной портал">
    <meta property="og:description" content="Главные новости города, криминал и сводки О МВД.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1590059352802-2c47e8b3f980?auto=format&fit=crop&q=80&w=1200&h=630">
    <meta property="og:url" content="https://gamer123top.github.io/kemerovo42-site/">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .hero-text h2, .card-content h3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body>

    <div id="header-container"></div>

    <nav id="main-nav">
        <a href="index.html" class="active">Главная</a>
    </nav>

    <div class="container">
        <main class="main-content">
            <div id="news-container"><p style="text-align: center; padding: 20px;">Загрузка новостей...</p></div>
            <div style="text-align: center; margin-top: 20px;">
                <button id="load-more-btn" onclick="loadMore()" style="display: none; padding: 12px 24px; background: var(--accent); border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.2s;">Показать еще</button>
            </div>
        </main>

        <aside class="sidebar">
            <div class="widget">
                <h3><i class="fas fa-fire" style="color: #e74c3c;"></i> Читают сейчас</h3>
                <ul id="popular-list" style="list-style: none; display: flex; flex-direction: column; gap: 15px;">
                    <li style="color: var(--text-muted); font-size: 0.9rem;">Загрузка...</li>
                </ul>
            </div>
        </aside>
    </div>

    <footer><p>&copy; 2026 Телепрограмма «Кемерово 42».</p></footer>

    <script type="module">
        import { renderHeader } from './header.js';
        import { firebaseConfig } from './firebase-config.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        // Добавили where для фильтрации черновиков
        import { getFirestore, collection, getDocs, query, orderBy, limit, startAfter, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        renderHeader();
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        const newsContainer = document.getElementById('news-container');
        const loadMoreBtn = document.getElementById('load-more-btn');
        const NEWS_PER_PAGE = 10;
        let lastVisible = null;
        let isFirstLoad = true;

        function formatDateTime(timestamp) {
            if (!timestamp || !timestamp.seconds) return 'Дата не указана';
            const utcDate = new Date(timestamp.seconds * 1000);
            const kDate = new Date(utcDate.getTime() + (7 * 60 * 60 * 1000));
            return `${kDate.toISOString().slice(0, 10).split('-').reverse().join('.')} ${kDate.toISOString().slice(11, 16)}`;
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        async function loadNews() {
            try {
                let q;
                // ФИЛЬТР: берем только опубликованные новости (status == 'published')
                if (isFirstLoad) {
                    q = query(collection(db, "news"), where("status", "==", "published"), orderBy("date", "desc"), limit(NEWS_PER_PAGE));
                } else if (lastVisible) {
                    q = query(collection(db, "news"), where("status", "==", "published"), orderBy("date", "desc"), startAfter(lastVisible), limit(NEWS_PER_PAGE));
                } else {
                    return;
                }

                const snapshot = await getDocs(q);
                if (snapshot.empty) { 
                    loadMoreBtn.style.display = 'none'; 
                    if (isFirstLoad) newsContainer.innerHTML = '<div style="text-align: center; padding: 60px 20px; background: var(--card-bg); border-radius: 16px;"><h3 style="color: var(--text-muted);">Новостей пока нет</h3></div>';
                    return; 
                }

                lastVisible = snapshot.docs[snapshot.docs.length - 1];
                if (snapshot.size === NEWS_PER_PAGE) loadMoreBtn.style.display = 'block';
                else loadMoreBtn.style.display = 'none';

                if (isFirstLoad) {
                    newsContainer.innerHTML = '';
                    let grid = document.createElement('div');
                    grid.className = 'news-grid';
                    newsContainer.appendChild(grid);
                    isFirstLoad = false;
                }

                const gridContainer = newsContainer.querySelector('.news-grid') || newsContainer;

                snapshot.forEach((doc, index) => {
                    const data = doc.data();
                    let dateStr = formatDateTime(data.date);
                    const imgSrc = data.image || 'https://images.unsplash.com/photo-1590059352802-2c47e8b3f980?auto=format&fit=crop&q=80&w=1200&h=500';
                    const imgTag = `<img src="${escapeHTML(imgSrc)}" onerror="this.src='https://images.unsplash.com/photo-1585829365295-ab7cd400c167?auto=format&fit=crop&q=80&w=400'">`;

                    if (index === 0 && newsContainer.children.length === 1) {
                        newsContainer.innerHTML = `
                            <a href="article.html?id=${doc.id}" class="hero-news" style="text-decoration: none; color: inherit;">
                                ${imgTag}
                                <div class="hero-text">
                                    <span class="tag">${escapeHTML(data.tag || 'НОВОСТЬ')}</span>
                                    <h2>${escapeHTML(data.title)}</h2>
                                    <p>${escapeHTML(data.description || '')}</p>
                                    <span class="date"><i class="far fa-clock"></i> ${dateStr} (Кемерово)</span>
                                </div>
                            </a>
                        `;
                        newsContainer.appendChild(grid);
                    } else {
                        gridContainer.innerHTML += `
                            <a href="article.html?id=${doc.id}" class="news-card" style="text-decoration: none; color: inherit;">
                                ${imgTag}
                                <div class="card-content">
                                    <span class="tag">${escapeHTML(data.tag || 'НОВОСТЬ')}</span>
                                    <h3>${escapeHTML(data.title)}</h3>
                                    <p>${escapeHTML(data.description || '')}</p>
                                    <span class="date" style="display:block; margin-top:10px; font-size:0.85rem;"><i class="far fa-clock"></i> ${dateStr} (Кемерово)</span>
                                </div>
                            </a>
                        `;
                    }
                });
            } catch (error) {
                console.error("Ошибка загрузки:", error);
                if (isFirstLoad) newsContainer.innerHTML = '<p style="text-align: center; padding: 20px; color: #e74c3c;">Ошибка загрузки. Возможно, требуется создать индекс в Firebase (F12).</p>';
            }
        }

        async function loadPopular() {
            const list = document.getElementById('popular-list');
            try {
                // Топ-5 тоже только среди опубликованных
                const q = query(collection(db, "news"), where("status", "==", "published"), orderBy("views", "desc"), limit(5));
                const snapshot = await getDocs(q);
                list.innerHTML = '';
                if (snapshot.empty) { list.innerHTML = '<li style="color: var(--text-muted);">Пока нет статистики</li>'; return; }
                let index = 1;
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    list.innerHTML += `
                        <li style="display: flex; gap: 12px; align-items: flex-start;">
                            <span style="font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 1.2rem; color: var(--accent); line-height: 1;">${index}</span>
                            <a href="article.html?id=${doc.id}" style="text-decoration: none; color: var(--text-color); font-size: 0.9rem; font-weight: 500; line-height: 1.4;">${escapeHTML(data.title)}</a>
                        </li>`;
                    index++;
                });
            } catch (e) { list.innerHTML = '<li style="color: #e74c3c;">Ошибка загрузки топа.</li>'; }
        }

        window.loadMore = function() { loadNews(); };
        loadNews();
        loadPopular();
    </script>
</body>
</html>
