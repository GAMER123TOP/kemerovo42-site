<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кемерово 42 | Главные новости</title>
    
    <meta property="og:title" content="КЕМЕРОВО 42 — Официальный новостной портал">
    <meta property="og:description" content="Главные новости города, криминал и сводки О МВД.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1590059352802-2c47e8b3f980?auto=format&fit=crop&q=80&w=1200&h=630">
    <meta property="og:url" content="https://gamer123top.github.io/kemerovo42-site/">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .hero-text h2, .card-content h3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo">
                <a href="index.html" style="text-decoration: none; color: white;">
                    <h1>КЕМЕРОВО <span>42</span></h1>
                </a>
                <p>Официальный новостной портал</p>
            </div>
            
            <div class="auth-buttons" id="auth-buttons" style="display: flex; align-items: center; gap: 15px; margin-left: auto;">
                <a href="./admin/login.html" id="login-btn" class="btn-outline" style="text-decoration: none; display: inline-flex;">Войти</a>
                <a href="./admin/index.html" id="dash-btn" class="btn-outline" style="text-decoration: none; display: none;">Панель управления</a>
                <a href="./admin/profile.html" id="prof-btn" class="btn-outline" style="text-decoration: none; display: none; align-items: center; gap: 8px; padding: 6px 16px;">
                    <img id="header-avatar" src="" style="width: 24px; height: 24px; border-radius: 50%; object-fit: cover; display: none; background: #ccc;">
                    <span id="header-username">Профиль</span>
                </a>
            </div>
            <button id="theme-toggle" style="margin-left: 10px;"><i class="fas fa-moon"></i> Тёмная тема</button>
        </div>
    </header>

    <nav>
        <a href="index.html" class="active">Главная</a>
        <a href="category.html?tag=Криминал">Криминал</a>
        <a href="category.html?tag=Город">Город</a>
        <a href="category.html?tag=О МВД">О МВД</a>
    </nav>

    <div class="container">
        <main class="main-content">
            <div id="news-container"><p style="text-align: center; padding: 20px;">Загрузка новостей...</p></div>
            
            <div style="text-align: center; margin-top: 20px;">
                <button id="load-more-btn" onclick="loadMore()" style="display: none; padding: 12px 24px; background: var(--accent); border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.2s;">Показать еще</button>
            </div>
        </main>

        <aside class="sidebar">
            <div class="widget">
                <h3><i class="fas fa-fire" style="color: #e74c3c;"></i> Читают сейчас</h3>
                <ul id="popular-list" style="list-style: none; display: flex; flex-direction: column; gap: 15px;">
                    <li style="color: var(--text-muted); font-size: 0.9rem;">Загрузка...</li>
                </ul>
            </div>
        </aside>
    </div>

    <footer>
        <p>&copy; 2026 Телепрограмма «Кемерово 42».</p>
    </footer>

    <script type="module">
        import { firebaseConfig } from './firebase-config.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy, limit, startAfter, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const newsContainer = document.getElementById('news-container');
        const loadMoreBtn = document.getElementById('load-more-btn');
        const NEWS_PER_PAGE = 10;
        
        let lastVisible = null;
        let isFirstLoad = true;

        // Авторизация
        onAuthStateChanged(auth, async (user) => {
            const loginBtn = document.getElementById('login-btn');
            const dashBtn = document.getElementById('dash-btn');
            const profBtn = document.getElementById('prof-btn');
            const headerAvatar = document.getElementById('header-avatar');
            const headerUsername = document.getElementById('header-username');

            if (user) {
                loginBtn.style.display = 'none';
                dashBtn.style.display = 'inline-flex';
                profBtn.style.display = 'inline-flex';
                headerUsername.innerText = user.email.split('@')[0];

                try {
                    const docSnap = await getDoc(doc(db, "users", user.uid));
                    if (docSnap.exists() && docSnap.data().photoURL) {
                        headerAvatar.src = docSnap.data().photoURL;
                        headerAvatar.style.display = 'block';
                    }
                } catch (e) {}
            } else {
                loginBtn.style.display = 'inline-flex';
                dashBtn.style.display = 'none';
                profBtn.style.display = 'none';
            }
        });

        function escapeHTML(str) {
            if (!str) return '';
            return str.toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // Загрузка новостей
        async function loadNews() {
            try {
                let q;
                if (isFirstLoad) {
                    q = query(collection(db, "news"), orderBy("date", "desc"), limit(NEWS_PER_PAGE));
                } else if (lastVisible) {
                    q = query(collection(db, "news"), orderBy("date", "desc"), startAfter(lastVisible), limit(NEWS_PER_PAGE));
                } else {
                    return;
                }

                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) { 
                    loadMoreBtn.style.display = 'none'; 
                    if (isFirstLoad) {
                        newsContainer.innerHTML = `
                            <div style="text-align: center; padding: 60px 20px; background: var(--card-bg); border-radius: var(--border-radius); box-shadow: var(--shadow-sm);">
                                <i class="fas fa-newspaper" style="font-size: 3rem; color: #cbd5e1; margin-bottom: 15px;"></i>
                                <h3 style="color: var(--text-muted);">Новостей пока нет</h3>
                                <p style="color: var(--text-muted); font-size: 0.9rem;">Редакция готовит первые материалы</p>
                            </div>
                        `;
                    }
                    return; 
                }

                lastVisible = querySnapshot.docs[querySnapshot.docs.length - 1];
                
                if (querySnapshot.size === NEWS_PER_PAGE) {
                    loadMoreBtn.style.display = 'block';
                } else {
                    loadMoreBtn.style.display = 'none';
                }

                if (isFirstLoad) {
                    newsContainer.innerHTML = '';
                    // Создаем контейнер для сетки, если новостей больше 1
                    let grid = document.createElement('div');
                    grid.className = 'news-grid';
                    newsContainer.appendChild(grid);
                    isFirstLoad = false;
                }

                const gridContainer = newsContainer.querySelector('.news-grid') || newsContainer;

                querySnapshot.forEach((doc, index) => {
                    const data = doc.data();
                    
                    // Безопасный парсинг даты
                    let dateStr = 'Дата не указана';
                    if (data.date && data.date.seconds) {
                        dateStr = new Date(data.date.seconds * 1000).toLocaleDateString('ru-RU');
                    } else if (data.date) {
                        try { dateStr = new Date(data.date).toLocaleDateString('ru-RU'); } catch(e) {}
                    }

                    const imgSrc = data.image || 'https://images.unsplash.com/photo-1590059352802-2c47e8b3f980?auto=format&fit=crop&q=80&w=1200&h=500';
                    const imgTag = `<img src="${escapeHTML(imgSrc)}" onerror="this.src='https://images.unsplash.com/photo-1585829365295-ab7cd400c167?auto=format&fit=crop&q=80&w=400'">`;

                    // Первая новость при первой загрузке — Hero
                    if (index === 0 && newsContainer.children.length === 1) {
                        newsContainer.innerHTML = `
                            <a href="article.html?id=${doc.id}" class="hero-news" style="text-decoration: none; color: inherit;">
                                ${imgTag}
                                <div class="hero-text">
                                    <span class="tag">${escapeHTML(data.tag || 'НОВОСТЬ')}</span>
                                    <h2>${escapeHTML(data.title)}</h2>
                                    <p>${escapeHTML(data.description || '')}</p>
                                    <span class="date"><i class="far fa-clock"></i> ${dateStr}</span>
                                </div>
                            </a>
                        `;
                        // Возвращаем сетку обратно после hero
                        newsContainer.appendChild(grid);
                    } else {
                        gridContainer.innerHTML += `
                            <a href="article.html?id=${doc.id}" class="news-card" style="text-decoration: none; color: inherit;">
                                ${imgTag}
                                <div class="card-content">
                                    <span class="tag">${escapeHTML(data.tag || 'НОВОСТЬ')}</span>
                                    <h3>${escapeHTML(data.title)}</h3>
                                    <p>${escapeHTML(data.description || '')}</p>
                                </div>
                            </a>
                        `;
                    }
                });
            } catch (error) {
                console.error("Ошибка загрузки:", error);
                if (isFirstLoad) newsContainer.innerHTML = '<p style="text-align: center; padding: 20px; color: #e74c3c;">Не удалось загрузить новости.</p>';
            }
        }

        // Топ-5
        async function loadPopular() {
            const list = document.getElementById('popular-list');
            try {
                const q = query(collection(db, "news"), orderBy("views", "desc"), limit(5));
                const snapshot = await getDocs(q);
                list.innerHTML = '';
                if (snapshot.empty) {
                    list.innerHTML = '<li style="color: var(--text-muted); font-size: 0.9rem;">Пока нет статистики</li>';
                    return;
                }
                let index = 1;
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    list.innerHTML += `
                        <li style="display: flex; gap: 12px; align-items: flex-start;">
                            <span style="font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 1.2rem; color: var(--accent); line-height: 1;">${index}</span>
                            <a href="article.html?id=${doc.id}" style="text-decoration: none; color: var(--text-color); font-size: 0.9rem; font-weight: 500; line-height: 1.4;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-color)'">
                                ${escapeHTML(data.title)}
                            </a>
                        </li>
                    `;
                    index++;
                });
            } catch (e) {
                list.innerHTML = '<li style="color: #e74c3c; font-size: 0.8rem;">Ошибка загрузки топа.</li>';
            }
        }

        window.loadMore = function() { loadNews(); };
        loadNews();
        loadPopular();
    </script>
    <script src="script.js"></script>
</body>
</html>
