<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кемерово 42 | Главные новости</title>
    
    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Georgia&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- МИНИМАЛИСТИЧНЫЙ СТИЛЬ ДЛЯ ГЛАВНОЙ --- */
        :root {
            --bg-color: #ffffff;
            --text-primary: #1a1a1a;
            --text-secondary: #6b7280;
            --accent: #2563eb;
            --border: #e5e7eb;
            --card-bg: #f9fafb;
            --font-serif: 'Georgia', serif;
            --font-sans: 'Inter', sans-serif;
        }

        body { background-color: var(--bg-color); color: var(--text-primary); font-family: var(--font-sans); }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; display: grid; grid-template-columns: 1fr 320px; gap: 40px; }
        
        /* Hero News */
        .hero-news { display: block; text-decoration: none; color: inherit; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 40px; }
        .hero-news img { width: 100%; height: 400px; object-fit: cover; border-radius: 4px; margin-bottom: 20px; }
        .hero-text h2 { font-family: var(--font-serif); font-size: 2.5rem; line-height: 1.2; margin-bottom: 15px; letter-spacing: -0.02em; }
        .hero-text p { font-size: 1.1rem; color: var(--text-secondary); line-height: 1.6; max-width: 90%; }
        
        /* News Grid */
        .news-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; }
        .news-card { display: block; text-decoration: none; color: inherit; transition: opacity 0.2s; }
        .news-card:hover { opacity: 0.8; }
        .news-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 4px; margin-bottom: 15px; }
        .news-card h3 { font-family: var(--font-serif); font-size: 1.4rem; line-height: 1.3; margin-bottom: 10px; }
        .news-card p { font-size: 0.95rem; color: var(--text-secondary); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* Sidebar Widgets */
        .widget { margin-bottom: 40px; }
        .widget h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; margin-bottom: 20px; border-bottom: 2px solid var(--text-primary); padding-bottom: 10px; display: inline-block; }
        #popular-list li { display: flex; gap: 15px; align-items: baseline; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        #popular-list span { font-family: var(--font-serif); font-size: 2rem; color: var(--border); font-weight: 700; line-height: 1; }
        #popular-list a { font-size: 1rem; font-weight: 500; line-height: 1.4; color: var(--text-primary); text-decoration: none; }
        #popular-list a:hover { color: var(--accent); }

        .date { font-size: 0.8rem; color: var(--text-secondary); margin-top: 10px; display: block; }
        .tag { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); font-weight: 600; margin-right: 10px; }

        #load-more-btn { background: transparent !important; border: 1px solid var(--border) !important; color: var(--text-primary) !important; padding: 12px 30px !important; border-radius: 4px !important; font-weight: 600 !important; cursor: pointer; transition: 0.2s; }
        #load-more-btn:hover { background: var(--text-primary) !important; color: white !important; border-color: var(--text-primary) !important; }

        @media (max-width: 900px) { 
            .container { grid-template-columns: 1fr; } 
            .news-grid { grid-template-columns: 1fr; } 
            .hero-text h2 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div id="header-container"></div>
    <nav id="main-nav" style="max-width: 1200px; margin: 0 auto; padding: 0 20px; border-bottom: 1px solid var(--border); display: flex; gap: 20px; overflow-x: auto;">
        <a href="index.html" class="active" style="padding: 15px 0; text-decoration: none; color: var(--text-primary); font-weight: 600; border-bottom: 2px solid var(--text-primary);">Главная</a>
    </nav>

    <div class="container">
        <main class="main-content">
            <div id="news-container">
                <!-- Скелетон -->
                <div class="hero-news" style="pointer-events: none;">
                    <div style="width: 100%; height: 400px; background: var(--card-bg); border-radius: 4px;"></div>
                    <div class="hero-text" style="margin-top: 20px;">
                        <div style="width: 100px; height: 20px; background: var(--card-bg); margin-bottom: 15px;"></div>
                        <div style="width: 80%; height: 40px; background: var(--card-bg); margin-bottom: 15px;"></div>
                    </div>
                </div>
            </div>
            
            <div style="text-align: center; margin-top: 40px;">
                <button id="load-more-btn" onclick="loadMore()" style="display: none;">Показать еще</button>
            </div>
        </main>

        <aside class="sidebar">
            <div class="widget">
                <h3><i class="fas fa-fire" style="color: var(--text-primary);"></i> Читают сейчас</h3>
                <ul id="popular-list" style="list-style: none; padding: 0; margin: 0;">
                    <li style="color: var(--text-secondary); font-size: 0.9rem;">Загрузка...</li>
                </ul>
            </div>
        </aside>
    </div>

    <footer style="text-align: center; padding: 40px; color: var(--text-secondary); font-size: 0.85rem; border-top: 1px solid var(--border); margin-top: 60px;">
        &copy; 2026 Телепрограмма «Кемерово 42». Все права защищены.
    </footer>

    <script type="module">
        import { renderHeader } from './header.js';
        import { db, auth } from './firebase-config.js';
        import { collection, getDocs, query, orderBy, limit, startAfter, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        renderHeader();
        
        const newsContainer = document.getElementById('news-container');
        const loadMoreBtn = document.getElementById('load-more-btn');
        const NEWS_PER_PAGE = 10;
        let lastVisible = null;
        let isFirstLoad = true;

        function formatDateTime(timestamp) {
            if (!timestamp || !timestamp.seconds) return '';
            const d = new Date(timestamp.seconds * 1000 + (7 * 60 * 60 * 1000));
            return `${d.toISOString().slice(0, 10).split('-').reverse().join('.')} ${d.toISOString().slice(11, 16)}`;
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        async function loadNews() {
            try {
                let q;
                if (isFirstLoad) q = query(collection(db, "news"), orderBy("date", "desc"), limit(NEWS_PER_PAGE));
                else if (lastVisible) q = query(collection(db, "news"), orderBy("date", "desc"), startAfter(lastVisible), limit(NEWS_PER_PAGE));
                else return;

                const snapshot = await getDocs(q);
                if (snapshot.empty) { 
                    loadMoreBtn.style.display = 'none'; 
                    if (isFirstLoad) newsContainer.innerHTML = '<p style="text-align:center; padding: 60px; color: var(--text-secondary);">Новостей пока нет</p>';
                    return; 
                }

                lastVisible = snapshot.docs[snapshot.docs.length - 1];
                loadMoreBtn.style.display = snapshot.size === NEWS_PER_PAGE ? 'block' : 'none';

                if (isFirstLoad) {
                    newsContainer.innerHTML = '';
                    isFirstLoad = false;
                }

                snapshot.forEach((doc, index) => {
                    const data = doc.data();
                    if (data.status === 'draft' || data.status === 'archived') return;

                    const dateStr = formatDateTime(data.date);
                    const imgSrc = data.image || 'https://images.unsplash.com/photo-1590059352802-2c47e8b3f980?auto=format&fit=crop&q=80&w=1200';
                    const tagsHTML = (data.tags || [data.tag || 'НОВОСТЬ']).map(t => `<span class="tag">${escapeHTML(t)}</span>`).join('');
                    const link = `article.html?article=${data.slug || 'news'}-${doc.id}`;

                    const cardHTML = `
                        <a href="${link}" class="${index === 0 && isFirstLoad === false ? 'hero-news' : 'news-card'}">
                            <img src="${escapeHTML(imgSrc)}" loading="lazy">
                            <div class="${index === 0 && isFirstLoad === false ? 'hero-text' : ''}">
                                <div style="margin-bottom: 10px;">${tagsHTML}</div>
                                <h2>${escapeHTML(data.title)}</h2>
                                ${index === 0 ? `<p>${escapeHTML(data.description || '')}</p>` : `<p>${escapeHTML(data.description || '')}</p>`}
                                <span class="date"><i class="far fa-clock"></i> ${dateStr}</span>
                            </div>
                        </a>
                    `;
                    newsContainer.insertAdjacentHTML('beforeend', cardHTML);
                });
            } catch (error) { console.error(error); }
        }

        async function loadPopular() {
            const list = document.getElementById('popular-list');
            try {
                const q = query(collection(db, "news"), where("status", "==", "published"), orderBy("views", "desc"), limit(5));
                const snapshot = await getDocs(q);
                list.innerHTML = '';
                if (snapshot.empty) { list.innerHTML = '<li style="color: var(--text-secondary);">Нет данных</li>'; return; }
                
                let i = 1;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const link = `article.html?article=${data.slug || 'news'}-${doc.id}`;
                    list.innerHTML += `
                        <li>
                            <span>${i}</span>
                            <a href="${link}">${escapeHTML(data.title)}</a>
                        </li>`;
                    i++;
                });
            } catch (e) { list.innerHTML = '<li style="color: var(--text-secondary);">Ошибка загрузки</li>'; }
        }

        window.loadMore = loadNews;
        loadNews();
        loadPopular();
    </script>
</body>
</html>
