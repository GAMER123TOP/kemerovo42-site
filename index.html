<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кемерово 42 | Главные новости</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo">
                <a href="index.html" style="text-decoration: none; color: white;">
                    <h1>КЕМЕРОВО <span>42</span></h1>
                </a>
                <p>Официальный новостной портал</p>
            </div>
            <div class="auth-buttons">
                <a href="/admin/login.html" class="btn-outline" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">Войти</a>
            </div>
            <button id="theme-toggle"><i class="fas fa-moon"></i> Тёмная тема</button>
        </div>
    </header>

    <nav>
        <a href="index.html" class="active">Главная</a>
        <a href="#">Криминал</a>
        <a href="#">Город</a>
        <a href="#">О МВД</a>
        <a href="#">Розыск</a>
    </nav>

    <div class="container">
        <main class="main-content">
            <!-- Сюда грузятся новости -->
            <div id="news-container"><p style="text-align: center; padding: 20px;">Загрузка новостей...</p></div>
        </main>

        <aside class="sidebar">
            <div class="widget">
                <h3><i class="fas fa-bolt" style="color: #d4af37;"></i> Молния</h3>
                <ul class="live-feed">
                    <li><span class="time">14:30</span> Спецназ завершил операцию в офисе. Задержаны 4 участника КОПГ.</li>
                </ul>
            </div>
        </aside>
    </div>

    <footer>
        <p>&copy; 2026 Телепрограмма «Кемерово 42». Все права защищены.</p>
    </footer>

    <!-- Подключаем Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ВСТАВЬ СЮДА СВОЙ КОНФИГ ИЗ FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyAtQiA2YnMurhbJ7_tlA6VgOGvTI6x3Cp8",
            authDomain: "kemerovo-42-4ba67.firebaseapp.com",
            projectId: "kemerovo-42-4ba67",
            storageBucket: "kemerovo-42-4ba67.firebasestorage.app",
            messagingSenderId: "664125425786",
            appId: "1:664125425786:web:80e9d5de247952eaaf13c3",
            measurementId: "G-HCE9BTKC5V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const newsContainer = document.getElementById('news-container');

        async function loadNews() {
            try {
                // Берем новости, сортируем по дате (сначала новые)
                const q = query(collection(db, "news"), orderBy("date", "desc"));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    newsContainer.innerHTML = '<p style="text-align: center; padding: 20px;">Новостей пока нет.</p>';
                    return;
                }

                let isFirst = true;
                let gridHTML = '<div class="news-grid">';

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const dateStr = new Date(data.date.seconds * 1000).toLocaleDateString('ru-RU');
                    const imgSrc = data.image || 'https://images.unsplash.com/photo-1590059352802-2c47e8b3f980?auto=format&fit=crop&q=80&w=1200&h=500'; // Картинка по умолчанию
                    
                    if (isFirst) {
                        // Первая новость — большая
                        newsContainer.innerHTML = `
                            <a href="article.html?id=${doc.id}" class="hero-news" style="text-decoration: none; color: inherit;">
                                <img src="${imgSrc}" alt="Фото">
                                <div class="hero-text">
                                    <span class="tag">🚨 ${data.tag || 'НОВОСТЬ'}</span>
                                    <h2>${data.title}</h2>
                                    <p>${data.description || ''}</p>
                                    <span class="date"><i class="far fa-clock"></i> ${dateStr}</span>
                                </div>
                            </a>
                        `;
                        isFirst = false;
                    } else {
                        // Остальные — карточки
                        gridHTML += `
                            <a href="article.html?id=${doc.id}" class="news-card" style="text-decoration: none; color: inherit;">
                                <img src="${imgSrc}" alt="Фото">
                                <div class="card-content">
                                    <span class="tag">${data.tag || 'НОВОСТЬ'}</span>
                                    <h3>${data.title}</h3>
                                    <p>${data.description || ''}</p>
                                </div>
                            </a>
                        `;
                    }
                });

                gridHTML += '</div>';
                newsContainer.innerHTML += gridHTML;

            } catch (error) {
                console.error("Ошибка загрузки:", error);
                newsContainer.innerHTML = `<p style="color:red; text-align:center;">Ошибка загрузки новостей.</p>`;
            }
        }

        loadNews();
    </script>
    <script src="script.js"></script>
</body>
</html>
