<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кемерово 42 | Главные новости</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Защита от длинных заголовков */
        .hero-text h2, .card-content h3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo">
                <a href="index.html" style="text-decoration: none; color: white;">
                    <h1>КЕМЕРОВО <span>42</span></h1>
                </a>
                <p>Официальный новостной портал</p>
            </div>
            <div class="auth-buttons" id="auth-buttons">
                <a href="./admin/login.html" id="login-btn" class="btn-outline" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">Войти</a>
                <a href="./admin/dashboard.html" id="dash-btn" class="btn-outline" style="text-decoration: none; display: none; margin-right: 10px;">Панель управления</a>
                
                <a href="./admin/profile.html" id="prof-btn" class="btn-outline" style="text-decoration: none; display: none; align-items: center; gap: 8px; padding-left: 6px;">
                    <img id="header-avatar" src="" style="width: 24px; height: 24px; border-radius: 50%; object-fit: cover; display: none; background: #ccc;">
                    <span id="header-username">Профиль</span>
                </a>
            </div>
            <button id="theme-toggle"><i class="fas fa-moon"></i> Тёмная тема</button>
        </div>
    </header>

    <nav>
        <a href="index.html" class="active">Главная</a>
        <a href="#">Криминал</a>
        <a href="#">Город</a>
        <a href="#">О МВД</a>
    </nav>

    <div class="container">
        <main class="main-content">
            <div id="news-container"><p style="text-align: center; padding: 20px;">Загрузка новостей...</p></div>
            <div style="text-align: center; margin-top: 20px;">
                <button id="load-more-btn" onclick="loadMore()" style="display: none; padding: 12px 24px; background: var(--accent); border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.2s;">Показать еще</button>
            </div>
        </main>

        <aside class="sidebar">
            <!-- Виджет Популярное -->
            <div class="widget">
                <h3><i class="fas fa-fire" style="color: #e74c3c;"></i> Читают сейчас</h3>
                <ul id="popular-list" style="list-style: none; display: flex; flex-direction: column; gap: 15px;">
                    <li style="color: var(--text-muted); font-size: 0.9rem;">Загрузка...</li>
                </ul>
            </div>
        </aside>
    </div>

    <footer>
        <p>&copy; 2026 Телепрограмма «Кемерово 42».</p>
    </footer>

    <!-- Скрипт авторизации и загрузки новостей -->
    <script type="module">
        import { firebaseConfig } from './firebase-config.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy, limit, startAfter, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        const newsContainer = document.getElementById('news-container');
        const loadMoreBtn = document.getElementById('load-more-btn');
        
        const NEWS_PER_PAGE = 10;
        let lastVisible = null;
        let isFirstLoad = true;
        let gridContainer = null;

        // --- Проверка авторизации и вывод аватарки ---
        onAuthStateChanged(auth, async (user) => {
            const loginBtn = document.getElementById('login-btn');
            const dashBtn = document.getElementById('dash-btn');
            const profBtn = document.getElementById('prof-btn');
            const headerAvatar = document.getElementById('header-avatar');
            const headerUsername = document.getElementById('header-username');

            if (user) {
                loginBtn.style.display = 'none';
                dashBtn.style.display = 'inline-flex';
                profBtn.style.display = 'inline-flex';
                
                headerUsername.innerText = user.email.split('@')[0];

                try {
                    const docSnap = await getDoc(doc(db, "users", user.uid));
                    if (docSnap.exists() && docSnap.data().photoURL) {
                        headerAvatar.src = docSnap.data().photoURL;
                        headerAvatar.style.display = 'block';
                    }
                } catch (e) {
                    console.log("Аватарка не загружена", e);
                }
            } else {
                loginBtn.style.display = 'inline-flex';
                dashBtn.style.display = 'none';
                profBtn.style.display = 'none';
            }
        });

        // --- Защита от XSS ---
        function escapeHTML(str) {
            if (!str) return '';
            return str.toString()
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // --- Загрузка новостей ---
        async function loadNews() {
            try {
                let q;
                if (isFirstLoad) {
                    q = query(collection(db, "news"), orderBy("date", "desc"), limit(NEWS_PER_PAGE));
                } else if (lastVisible) {
                    q = query(collection(db, "news"), orderBy("date", "desc"), startAfter(lastVisible), limit(NEWS_PER_PAGE));
                } else {
                    return;
                }

                const querySnapshot = await getDocs(q);
                if (querySnapshot.empty) { 
                    loadMoreBtn.style.display = 'none'; 
                    if (isFirstLoad) newsContainer.innerHTML = '<p style="text-align:center; padding:20px;">Новостей пока нет.</p>';
                    return; 
                }

                lastVisible = querySnapshot.docs[querySnapshot.docs.length - 1];
                loadMoreBtn.style.display = 'block';

                if (isFirstLoad) {
                    newsContainer.innerHTML = '';
                    gridContainer = document.createElement('div');
                    gridContainer.className = 'news-grid';
                    isFirstLoad = false;
                }

                let isFirstNews = (lastVisible === querySnapshot.docs[querySnapshot.docs.length - 1] && newsContainer.innerHTML === '');

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    let dateStr = 'Дата не указана';
                    if (data.date && data.date.seconds) {
                        dateStr = new Date(data.date.seconds * 1000).toLocaleDateString('ru-RU');
                    }

                    const imgSrc = data.image || 'https://images.unsplash.com/photo-1590059352802-2c47e8b3f980?auto=format&fit=crop&q=80&w=1200&h=500';
                    const imgTag = `<img src="${escapeHTML(imgSrc)}" onerror="this.src='https://images.unsplash.com/photo-1585829365295-ab7cd400c167?auto=format&fit=crop&q=80&w=400'">`;

                    if (isFirstNews) {
                        const heroHTML = `
                            <a href="article.html?id=${doc.id}" class="hero-news" style="text-decoration: none; color: inherit;">
                                ${imgTag}
                                <div class="hero-text">
                                    <span class="tag">${escapeHTML(data.tag || 'НОВОСТЬ')}</span>
                                    <h2>${escapeHTML(data.title)}</h2>
                                    <p>${escapeHTML(data.description || '')}</p>
                                    <span class="date"><i class="far fa-clock"></i> ${dateStr}</span>
                                </div>
                            </a>
                        `;
                        newsContainer.innerHTML += heroHTML;
                        newsContainer.appendChild(gridContainer);
                    } else {
                        const cardHTML = `
                            <a href="article.html?id=${doc.id}" class="news-card" style="text-decoration: none; color: inherit;">
                                ${imgTag}
                                <div class="card-content">
                                    <span class="tag">${escapeHTML(data.tag || 'НОВОСТЬ')}</span>
                                    <h3>${escapeHTML(data.title)}</h3>
                                    <p>${escapeHTML(data.description || '')}</p>
                                </div>
                            </a>
                        `;
                        gridContainer.innerHTML += cardHTML;
                    }
                });

            } catch (error) {
                console.error("Ошибка:", error);
                if (isFirstLoad) {
                    newsContainer.innerHTML = '<p style="text-align: center; padding: 20px; color: #e74c3c;">Не удалось загрузить новости. Попробуйте позже.</p>';
                    loadMoreBtn.style.display = 'none';
                }
            }
        }

        // --- Загрузка популярных новостей (Топ 5) ---
        async function loadPopular() {
            const list = document.getElementById('popular-list');
            try {
                const q = query(
                    collection(db, "news"), 
                    orderBy("views", "desc"), 
                    limit(5)
                );
                const snapshot = await getDocs(q);
                
                list.innerHTML = '';
                
                if (snapshot.empty) {
                    list.innerHTML = '<li style="color: var(--text-muted); font-size: 0.9rem;">Пока нет статистики</li>';
                    return;
                }

                let index = 1;
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const views = data.views || 0;
                    
                    list.innerHTML += `
                        <li style="display: flex; gap: 12px; align-items: flex-start;">
                            <span style="font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 1.2rem; color: var(--accent); line-height: 1;">${index}</span>
                            <a href="article.html?id=${doc.id}" style="text-decoration: none; color: var(--text-color); font-size: 0.9rem; font-weight: 500; line-height: 1.4; transition: 0.2s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-color)'">
                                ${escapeHTML(data.title)}
                            </a>
                        </li>
                    `;
                    index++;
                });
            } catch (e) {
                console.error("Ошибка загрузки топа:", e);
                list.innerHTML = '<li style="color: #e74c3c; font-size: 0.8rem;">Требуется создать индекс в Firebase (F12 для подробностей).</li>';
            }
        }

        window.loadMore = function() { loadNews(); };
        
        // Запускаем всё при загрузке
        loadNews();
        loadPopular();
    </script>
    <script src="script.js"></script>
</body>
</html>
