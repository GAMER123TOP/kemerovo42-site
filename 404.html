<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Страница не найдена</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; background: var(--bg-color);">

    <div id="header-container"></div>

    <main style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center;">
        <div style="background: var(--card-bg); padding: 60px 40px; border-radius: var(--border-radius); box-shadow: var(--shadow-md); max-width: 500px;">
            <h1 style="font-family: 'Montserrat', sans-serif; font-size: 6rem; color: var(--accent); line-height: 1; margin-bottom: 10px;">404</h1>
            <h2 style="margin-bottom: 20px;">Страница не найдена</h2>
            <p style="color: var(--text-muted); margin-bottom: 30px;">Возможно, новость была удалена, или вы ошиблись в адресе.</p>
            <a href="index.html" class="btn-outline" style="background: var(--header-bg); color: white; border: none; padding: 12px 24px; text-decoration: none; border-radius: 8px;">← Вернуться на главную</a>
        </div>
    </main>

    <script type="module">
        import { renderHeader } from './header.js';
        renderHeader();
    </script>
</body>
</html>
