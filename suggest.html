<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Предложить новость | Кемерово 42</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Georgia&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #ffffff; --text-primary: #1a1a1a; --text-secondary: #6b7280;
            --border: #e5e7eb; --font-sans: 'Inter', sans-serif; --font-serif: 'Georgia', serif;
        }
        body { background: var(--bg-color); color: var(--text-primary); font-family: var(--font-sans); }
        
        .suggest-container { max-width: 600px; margin: 60px auto; padding: 0 20px; }
        .suggest-container h1 { font-family: var(--font-serif); font-size: 2.5rem; margin-bottom: 10px; letter-spacing: -0.02em; }
        .suggest-container > p { color: var(--text-secondary); margin-bottom: 40px; font-size: 1.1rem; line-height: 1.6; }
        
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-primary); }
        
        .form-control { 
            width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 4px; 
            font-family: inherit; font-size: 1rem; background: #fff; color: var(--text-primary);
            transition: border-color 0.2s; box-sizing: border-box;
        }
        .form-control:focus { outline: none; border-color: var(--text-primary); }
        
        .btn-submit { 
            width: 100%; padding: 16px; background: var(--text-primary); color: white; 
            border: none; border-radius: 4px; font-weight: 600; font-size: 1rem; cursor: pointer; 
            transition: opacity 0.2s; margin-top: 10px;
        }
        .btn-submit:hover { opacity: 0.9; }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div id="header-container"></div>

    <div class="suggest-container">
        <h1>Предложить новость</h1>
        <p>Есть интересная информация? Отправьте её в редакцию. Мы проверим факты и опубликуем, если это действительно важно для города.</p>
        
        <form id="suggest-form">
            <div class="form-group">
                <label>Ваше имя или никнейм</label>
                <input type="text" id="suggest-author" class="form-control" placeholder="Иван Иванов" required>
            </div>
            <div class="form-group">
                <label>Заголовок</label>
                <input type="text" id="suggest-title" class="form-control" placeholder="Краткая суть события" required>
            </div>
            <div class="form-group">
                <label>Текст новости</label>
                <textarea id="suggest-text" class="form-control" rows="8" placeholder="Подробности, место, время..." required></textarea>
            </div>
            <button type="submit" class="btn-submit">Отправить в редакцию</button>
        </form>
    </div>

    <script type="module">
        import { renderHeader } from './header.js';
        import { db } from './firebase-config.js';
        import { showToast } from './ui.js';
        import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        renderHeader();

        document.getElementById('suggest-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            
            btn.innerText = 'Отправка...';
            btn.disabled = true;

            try {
                await addDoc(collection(db, "suggestions"), {
                    author: document.getElementById('suggest-author').value.trim(),
                    title: document.getElementById('suggest-title').value.trim(),
                    text: document.getElementById('suggest-text').value.trim(),
                    date: serverTimestamp(),
                    status: 'new'
                });
                showToast("Спасибо! Новость отправлена на проверку.", 'success');
                e.target.reset();
            } catch (error) {
                console.error(error);
                showToast("Ошибка отправки. Попробуйте позже.", 'error');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
