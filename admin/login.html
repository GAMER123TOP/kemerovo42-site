<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Вход | Кемерово 42</title>
  <link rel="stylesheet" href="admin-style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; background: var(--sidebar-bg); }
    .login-box { background: var(--card-bg); padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border-top: 4px solid var(--accent); }
    .login-box h2 { text-align: center; margin-bottom: 30px; font-family: 'Montserrat'; font-size: 1.8rem; }
    .login-btn { width: 100%; padding: 14px; background: var(--accent); border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-top: 10px; color: var(--sidebar-bg); }
    .login-btn:hover { background: #b8962e; }
    .error { color: #ef4444; font-size: 0.85rem; text-align: center; margin-top: 15px; min-height: 20px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Вход в редакцию</h2>
    <div class="form-group">
        <label>Логин</label>
        <input type="text" id="login" class="form-control" placeholder="Логин">
    </div>
    <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="password" class="form-control" placeholder="Пароль">
    </div>
    <button onclick="login()" class="login-btn">Войти</button>
    <div id="error" class="error"></div>
  </div>

  <script type="module">
    import { firebaseConfig } from '../firebase-config.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.login = async function() {
      const loginVal = document.getElementById('login').value.trim();
      const pass = document.getElementById('password').value;
      const errorDiv = document.getElementById('error');

      if (!loginVal || !pass) { errorDiv.innerText = "Заполните все поля"; return; }
      const email = loginVal.includes('@') ? loginVal : `${loginVal}@k42.ru`;

      try {
        await signInWithEmailAndPassword(auth, email, pass);
        window.location.href = 'index.html';
      } catch (e) {
        errorDiv.innerText = "Неверный логин или пароль";
      }
    };
  </script>
</body>
</html>
