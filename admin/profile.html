<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Профиль | Кемерово 42</title>
  <link rel="stylesheet" href="admin-style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .profile-container { max-width: 600px; margin: 40px auto; padding: 0 20px; }
    .avatar-section { display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; }
    .avatar-preview { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; background: #e2e8f0; border: 4px solid var(--accent); margin-bottom: 15px; }
    .btn-save { background: var(--accent); color: var(--sidebar-bg); border: none; padding: 14px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.2s; margin-top: 10px;}
    .btn-save:hover { background: #b8962e; }
    .btn-pass { background: #3b82f6; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.2s; margin-top: 10px;}
    .btn-pass:hover { background: #2563eb; }
  </style>
</head>
<body style="display:block; background: var(--admin-bg);">

  <div style="background: var(--sidebar-bg); color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--accent);">
    <h2 style="font-family: 'Montserrat'; margin:0;"><i class="fas fa-user-circle"></i> Мой профиль</h2>
    <a href="index.html" style="color: var(--accent); text-decoration: none; font-weight: 600;"><i class="fas fa-arrow-left"></i> В панель</a>
  </div>

  <div class="profile-container">
    <div class="card" id="profile-box" style="display:none;">
      
      <div class="avatar-section">
        <img id="avatar-preview" class="avatar-preview" src="https://upload.wikimedia.org/wikipedia/commons/7/7c/Profile_avatar_placeholder_large.png" alt="Аватар">
        <div class="form-group" style="width: 100%;">
            <label>Ссылка на аватарку (URL)</label>
            <input type="text" id="avatar-url" class="form-control" placeholder="https://example.com/avatar.jpg" oninput="previewAvatar(this.value)">
        </div>
      </div>

      <hr style="border:0; border-top: 1px solid var(--border); margin: 20px 0;">

      <div class="form-group">
          <label>Email (Логин, нельзя изменить)</label>
          <input type="text" id="email" class="form-control" disabled style="background:#f1f5f9; color:#94a3b8;">
      </div>
      <div class="form-group">
          <label>ФИО (для новостей)</label>
          <input type="text" id="displayName" class="form-control" placeholder="Иван Петров">
      </div>
      <button onclick="saveProfile()" class="btn-save">Сохранить изменения</button>

      <hr style="border:0; border-top: 1px solid var(--border); margin: 30px 0;">

      <h3 style="margin-bottom: 15px; font-family: 'Montserrat';">Смена пароля</h3>
      <div class="form-group">
          <label>Текущий пароль</label>
          <input type="password" id="old-pass" class="form-control" placeholder="••••••••">
      </div>
      <div class="form-group">
          <label>Новый пароль</label>
          <input type="password" id="new-pass" class="form-control" placeholder="••••••••">
      </div>
      <button onclick="changePassword()" class="btn-pass">Обновить пароль</button>

    </div>
  </div>

  <script type="module">
    import { firebaseConfig } from '../firebase-config.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, updatePassword, reauthenticateWithCredential, EmailAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let currentUid = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      currentUid = user.uid;
      document.getElementById('profile-box').style.display = 'block';
      document.getElementById('email').value = user.email;

      const snap = await getDoc(doc(db, 'users', user.uid));
      if (snap.exists()) {
        const data = snap.data();
        document.getElementById('displayName').value = data.displayName || '';
        if (data.photoURL) {
          document.getElementById('avatar-url').value = data.photoURL;
          document.getElementById('avatar-preview').src = data.photoURL;
        }
      }
    });

    window.previewAvatar = function(url) {
      document.getElementById('avatar-preview').src = url || 'https://upload.wikimedia.org/wikipedia/commons/7/7c/Profile_avatar_placeholder_large.png';
    };

    window.saveProfile = async function() {
      const displayName = document.getElementById('displayName').value.trim();
      const photoURL = document.getElementById('avatar-url').value.trim();
      
      const userEmail = auth.currentUser.email; 

      // Получаем роль из токена (claims)
      const token = await auth.currentUser.getIdTokenResult();
      let userRole = 'editor'; 
      if (token.claims.admin) userRole = 'admin';
      else if (token.claims.editor) userRole = 'editor';

      try {
        await setDoc(doc(db, 'users', currentUid), { 
          displayName: displayName, 
          photoURL: photoURL,
          email: userEmail,
          role: userRole
        }, { merge: true });
        alert('Профиль обновлен!');
      } catch (e) { 
        alert('Ошибка сохранения: ' + e.message); 
      }
    };

    window.changePassword = async function() {
      const oldP = document.getElementById('old-pass').value;
      const newP = document.getElementById('new-pass').value;
      if (!oldP || !newP) return alert('Заполните оба поля!');
      if (newP.length < 6) return alert('Пароль должен быть минимум 6 символов');

      const cred = EmailAuthProvider.credential(auth.currentUser.email, oldP);
      try {
        await reauthenticateWithCredential(auth.currentUser, cred);
        await updatePassword(auth.currentUser, newP);
        alert('Пароль успешно изменен!');
        document.getElementById('old-pass').value = '';
        document.getElementById('new-pass').value = '';
      } catch (e) { alert('Ошибка: ' + e.message); }
    };
  </script>
</body>
</html>
