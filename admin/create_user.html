<!doctype html>
<html>
<head><meta charset="utf-8"><title>Создание юзера</title></head>
<body>
  <h1>Открой консоль (F12) и напиши: createNewUser('логин', 'пароль', 'роль')</h1>
  <p>Роль: 'admin' (главный) или 'journalist' (журналист).</p>

  <script type="module">
    import { firebaseConfig } from '../firebase-config.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function hashPass(pass) {
        const msgBuffer = new TextEncoder().encode(pass);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    window.createNewUser = async function(username, password, role = 'journalist') {
        const q = query(collection(db, "users"), where("username", "==", username));
        const querySnapshot = await getDocs(q);
        
        if (!querySnapshot.empty) {
            console.log("❌ Ошибка: Логин уже занят!");
            return;
        }

        const hash = await hashPass(password);
        
        await addDoc(collection(db, "users"), {
            username: username,
            passwordHash: hash,
            role: role,
            created: new Date()
        });
        console.log(`✅ Пользователь ${username} с ролью ${role} создан!`);
    }
  </script>
</body>
</html>
