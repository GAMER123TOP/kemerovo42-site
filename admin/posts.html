<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Записи | Кемерово 42</title>
  <link rel="stylesheet" href="admin-style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
    .status-published { background: #dcfce7; color: #166534; }
    .status-draft { background: #fef08a; color: #854d0e; }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Все новости</h1>
      <a href="create.html" class="btn-create"><i class="fas fa-plus"></i> Добавить</a>
    </div>

    <div class="card">
      <table class="wp-table">
        <thead>
          <tr>
            <th>Заголовок</th>
            <th>Статус</th>
            <th>Рубрика</th>
            <th>Просмотры</th>
            <th style="text-align: right;">Действия</th>
          </tr>
        </thead>
        <tbody id="news-list"><tr><td colspan="5" style="text-align:center;">Загрузка...</td></tr></tbody>
      </table>
    </div>
  </main>

  <script type="module">
    import { renderSidebar } from './sidebar.js';
    import { firebaseConfig } from '../firebase-config.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    renderSidebar('posts');
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadAllNews() {
      const tbody = document.getElementById('news-list');
      try {
        const snapshot = await getDocs(query(collection(db, "news"), orderBy("date", "desc")));
        tbody.innerHTML = '';
        if (snapshot.empty) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Новостей нет</td></tr>'; return; }
        
        snapshot.forEach(docSnap => {
          const d = docSnap.data();
          
          // Определяем статус (если поля нет, считаем, что опубликовано)
          const isDraft = d.status === 'draft';
          const statusBadge = isDraft 
            ? '<span class="status-badge status-draft">Черновик</span>' 
            : '<span class="status-badge status-published">Опубликовано</span>';

          tbody.innerHTML += `
            <tr>
              <td>
                <div class="row-title">${d.title}</div>
                <div class="row-meta">Автор: ${d.author || 'Редакция'}</div>
              </td>
              <td>${statusBadge}</td>
              <td>${d.tag || 'Новость'}</td>
              <td><i class="far fa-eye"></i> ${d.views || 0}</td>
              <td style="text-align: right;">
                <div class="actions" style="justify-content: flex-end;">
                  <!-- Кнопка редактирования (карандаш) -->
                  <a href="create.html?id=${docSnap.id}" class="btn-icon" title="Редактировать"><i class="fas fa-pen"></i></a>
                  
                  ${!isDraft ? `<a href="../article.html?id=${docSnap.id}" target="_blank" class="btn-icon" title="Посмотреть"><i class="fas fa-eye"></i></a>` : ''}
                  
                  <button onclick="deleteNews('${docSnap.id}')" class="btn-icon danger" title="Удалить"><i class="fas fa-trash"></i></button>
                </div>
              </td>
            </tr>`;
        });
      } catch (e) { 
        console.error(e);
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">Ошибка загрузки</td></tr>'; 
      }
    }

    window.deleteNews = async function(id) {
      if(confirm('Удалить новость?')) {
        try { await deleteDoc(doc(db, "news", id)); loadAllNews(); } catch (e) { alert('Ошибка удаления'); }
      }
    };
    loadAllNews();
  </script>
</body>
</html>
