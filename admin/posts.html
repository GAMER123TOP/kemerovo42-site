<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Записи | Кемерово 42</title>
  <link rel="stylesheet" href="admin-style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-logo">КЕМЕРОВО <span>42</span></div>
    <ul class="sidebar-menu">
      <li><a href="index.html"><i class="fas fa-home"></i> Дашборд</a></li>
      <li><a href="posts.html" class="active"><i class="fas fa-newspaper"></i> Записи (Новости)</a></li>
      <li><a href="create.html"><i class="fas fa-plus-circle"></i> Добавить новость</a></li>
      <li><a href="users.html" id="menu-users" style="display: none;"><i class="fas fa-users"></i> Пользователи</a></li>
      <li><a href="../index.html"><i class="fas fa-external-link-alt"></i> На сайт</a></li>
    </ul>
    <div class="sidebar-user">
      <img id="sb-avatar" src="https://upload.wikimedia.org/wikipedia/commons/7/7c/Profile_avatar_placeholder_large.png" alt="Аватар">
      <div class="sidebar-user-info">
        <span class="sidebar-user-name" id="sb-name">Загрузка...</span>
        <span class="sidebar-user-role" id="sb-role">...</span>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Все новости</h1>
      <a href="create.html" class="btn-create"><i class="fas fa-plus"></i> Добавить</a>
    </div>

    <div class="card">
      <table class="wp-table">
        <thead>
          <tr>
            <th>Заголовок</th>
            <th>Рубрика</th>
            <th>Просмотры</th>
            <th>Дата</th>
            <th style="text-align: right;">Действия</th>
          </tr>
        </thead>
        <tbody id="news-list">
          <tr><td colspan="5" style="text-align:center;">Загрузка...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script type="module">
    import { firebaseConfig } from '../firebase-config.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy, deleteDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      
      const token = await user.getIdTokenResult();
      const role = token.claims.admin ? 'admin' : (token.claims.editor ? 'editor' : 'journalist');
      
      document.getElementById('sb-name').innerText = user.email.split('@')[0];
      document.getElementById('sb-role').innerText = role === 'admin' ? 'Администратор' : 'Редактор';
      
      if (role === 'admin') {
        document.getElementById('menu-users').style.display = 'block';
      }

      const userSnap = await getDoc(doc(db, "users", user.uid));
      if (userSnap.exists() && userSnap.data().photoURL) {
        document.getElementById('sb-avatar').src = userSnap.data().photoURL;
      }

      loadAllNews();
    });

    async function loadAllNews() {
      const tbody = document.getElementById('news-list');
      try {
        const q = query(collection(db, "news"), orderBy("date", "desc"));
        const snapshot = await getDocs(q);

        tbody.innerHTML = '';
        if (snapshot.empty) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Новостей нет</td></tr>';
          return;
        }

        snapshot.forEach(docSnap => {
          const d = docSnap.data();
          let dateStr = d.date && d.date.seconds ? new Date(d.date.seconds * 1000).toLocaleDateString('ru-RU') : '—';
          let views = d.views || 0;
          
          tbody.innerHTML += `
            <tr>
              <td>
                <div class="row-title">${d.title}</div>
                <div class="row-meta">Автор: ${d.author || 'Редакция'}</div>
              </td>
              <td>${d.tag || 'Новость'}</td>
              <td><i class="far fa-eye"></i> ${views}</td>
              <td>${dateStr}</td>
              <td style="text-align: right;">
                <div class="actions" style="justify-content: flex-end;">
                  <a href="../article.html?id=${docSnap.id}" target="_blank" class="btn-icon" title="Посмотреть"><i class="fas fa-eye"></i></a>
                  <button onclick="deleteNews('${docSnap.id}')" class="btn-icon danger" title="Удалить"><i class="fas fa-trash"></i></button>
                </div>
              </td>
            </tr>
          `;
        });
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">Ошибка загрузки</td></tr>';
      }
    }

    window.deleteNews = async function(id) {
      if(confirm('Вы уверены, что хотите удалить эту новость?')) {
        try {
          await deleteDoc(doc(db, "news", id));
          loadAllNews();
        } catch (e) {
          alert('Ошибка удаления. Проверьте права.');
        }
      }
    };
  </script>
</body>
</html>
