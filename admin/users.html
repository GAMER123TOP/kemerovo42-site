<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Пользователи | Кемерово 42</title>
  <link rel="stylesheet" href="admin-style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div id="sidebar-container"></div>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Пользователи</h1>
    </div>

    <div class="card">
      <table class="wp-table">
        <thead>
          <tr><th>ФИО</th><th>Логин</th><th>Email</th><th>Роль</th><th style="text-align: right;">Действия</th></tr>
        </thead>
        <tbody id="users-list"><tr><td colspan="5" style="text-align:center;">Загрузка...</td></tr></tbody>
      </table>
    </div>
    
    <div style="background: #fef2f2; border: 1px solid #f87171; padding: 15px; border-radius: 8px; margin-top: 20px; color: #991b1b; font-size: 0.9rem;">
      <i class="fas fa-exclamation-triangle"></i> <strong>Внимание:</strong> Кнопка «Заблокировать» удаляет профиль из базы данных. Пользователь больше не сможет публиковать новости. Однако его аккаунт для входа (Email) остается в Firebase. Чтобы удалить его полностью, зайдите в <a href="https://console.firebase.google.com/" target="_blank" style="color: #991b1b; font-weight: bold;">Firebase Console → Authentication</a>.
    </div>
  </main>

  <script type="module">
    import { renderSidebar } from './sidebar.js';
    import { firebaseConfig } from '../firebase-config.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    renderSidebar('users');
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    let currentUserUid = null; // Запоминаем айди текущего админа

    onAuthStateChanged(auth, async (user) => {
      if (!user) return;
      currentUserUid = user.uid;
      
      const token = await user.getIdTokenResult();
      if (!token.claims.admin) { window.location.href = 'index.html'; return; }
      
      loadUsers();
    });

    async function loadUsers() {
      const tbody = document.getElementById('users-list');
      const snapshot = await getDocs(collection(db, "users"));
      tbody.innerHTML = '';
      if (snapshot.empty) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Пользователей пока нет</td></tr>'; return; }

      snapshot.forEach(docSnap => {
        const d = docSnap.data();
        let roleText = d.role === 'admin' ? 'Администратор' : 'Редактор';
        let roleColor = d.role === 'admin' ? '#d4af37' : '#3b82f6';
        let loginText = d.email ? d.email.split('@')[0] : 'Неизвестен';
        
        // Если это наш профиль, мы не даем его удалить (прячем кнопку)
        const isMe = docSnap.id === currentUserUid;
        const deleteBtn = isMe 
            ? `<span style="font-size: 0.8rem; color: #94a3b8;">Это вы</span>` 
            : `<button onclick="deleteUser('${docSnap.id}', '${d.role}')" class="btn-icon danger" title="Удалить профиль"><i class="fas fa-user-slash"></i></button>`;

        tbody.innerHTML += `
          <tr>
            <td><div class="row-title">${d.displayName || 'Без ФИО'}</div></td>
            <td><strong>${loginText}</strong></td>
            <td style="color: var(--text-muted);">${d.email || 'Не указан'}</td>
            <td><span style="color: ${roleColor}; font-weight: 600;">${roleText}</span></td>
            <td style="text-align: right;">${deleteBtn}</td>
          </tr>`;
      });
    }

    window.deleteUser = async function(id, role) {
      // Дополнительная проверка на всякий случай
      if (id === currentUserUid) {
        return alert('Вы не можете удалить свой собственный профиль!');
      }
      if (role === 'admin') {
        return alert('Вы не можете удалить профиль другого администратора!');
      }

      if(confirm('Заблокировать доступ? Профиль удалится из базы, но аккаунт для входа останется.')) { 
        await deleteDoc(doc(db, "users", id)); 
        loadUsers(); 
      }
    };
  </script>
</body>
</html>
