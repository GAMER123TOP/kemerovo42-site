<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Настройки сайта | Кемерово 42</title>
  <link rel="stylesheet" href="admin-style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div id="sidebar-container"></div>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Настройки сайта</h1>
    </div>

    <div class="card">
      <h3 style="margin-bottom: 20px; font-family: 'Montserrat';">Бегущая строка</h3>
      
      <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
        <input type="checkbox" id="ticker-enabled" style="width: 20px; height: 20px; cursor: pointer;">
        <label for="ticker-enabled" style="margin: 0; cursor: pointer; font-weight: 600;">Показывать бегущую строку на сайте</label>
      </div>

      <div class="form-group">
        <label>Текст бегущей строки (если пусто — будут крутиться последние новости)</label>
        <input type="text" id="ticker-text" class="form-control" placeholder="Например: Срочные новости! Читайте нас...">
      </div>

      <button onclick="saveSettings()" class="btn-create" style="margin-top: 15px;">Сохранить настройки</button>
    </div>
  </main>

  <script type="module">
    import { renderSidebar } from './sidebar.js';
    import { firebaseConfig } from '../firebase-config.js';
    import { showToast } from '../ui.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    renderSidebar('settings');
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Загружаем текущие настройки
    async function loadSettings() {
      try {
        const docSnap = await getDoc(doc(db, "settings", "ticker"));
        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById('ticker-enabled').checked = data.enabled !== false; // По умолчанию включено
          document.getElementById('ticker-text').value = data.customText || '';
        } else {
            document.getElementById('ticker-enabled').checked = true; // Если нет настроек, включаем
        }
      } catch (e) {
        console.error("Ошибка загрузки настроек:", e);
      }
    }
    loadSettings();

    // Сохраняем настройки
    window.saveSettings = async function() {
      const enabled = document.getElementById('ticker-enabled').checked;
      const customText = document.getElementById('ticker-text').value.trim();

      try {
        await setDoc(doc(db, "settings", "ticker"), {
          enabled: enabled,
          customText: customText
        });
        showToast('Настройки сохранены!', 'success');
      } catch (e) {
        console.error(e);
        showToast('Ошибка сохранения', 'error');
      }
    };
  </script>
</body>
</html>
