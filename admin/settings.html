<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Настройки сайта | Кемерово 42</title>
  <link rel="stylesheet" href="admin-style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div id="sidebar-container"></div>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Настройки сайта</h1>
    </div>

    <div class="card">
      <h3 style="margin-bottom: 20px; font-family: 'Montserrat';">Бегущая строка</h3>
      <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
        <input type="checkbox" id="ticker-enabled" style="width: 20px; height: 20px; cursor: pointer;">
        <label for="ticker-enabled" style="margin: 0; cursor: pointer; font-weight: 600;">Показывать бегущую строку</label>
      </div>
      <div class="form-group">
        <label>Текст бегущей строки (если пусто — последние новости)</label>
        <input type="text" id="ticker-text" class="form-control" placeholder="Например: Срочные новости!">
      </div>
      <button onclick="saveSettings()" class="btn-create" style="margin-top: 15px;">Сохранить настройки</button>
    </div>

    <!-- БЛОК РЕЖИМА ОБСЛУЖИВАНИЯ -->
    <div class="card" style="margin-top: 20px; border: 2px solid #ef4444;">
      <h3 style="margin-bottom: 20px; font-family: 'Montserrat'; color: #ef4444;">Режим обслуживания</h3>
      <p style="color: var(--text-muted); margin-bottom: 20px;">Если включить, сайт увидят только администраторы. Все остальные увидят заглушку.</p>
      
      <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
        <input type="checkbox" id="maintenance-enabled" style="width: 20px; height: 20px; cursor: pointer; accent-color: #ef4444;">
        <label for="maintenance-enabled" style="margin: 0; cursor: pointer; font-weight: 600; color: #ef4444;">Включить режим обслуживания</label>
      </div>
      <button onclick="saveMaintenance()" class="btn-create" style="background: #ef4444; color: white;">Применить</button>
    </div>
  </main>

  <script type="module">
    import { renderSidebar } from './sidebar.js';
    import { firebaseConfig } from '../firebase-config.js';
    import { showToast } from '../ui.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    renderSidebar('settings');
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadSettings() {
      try {
        const tickerSnap = await getDoc(doc(db, "settings", "ticker"));
        if (tickerSnap.exists()) {
          document.getElementById('ticker-enabled').checked = tickerSnap.data().enabled !== false;
          document.getElementById('ticker-text').value = tickerSnap.data().customText || '';
        }

        const maintSnap = await getDoc(doc(db, "settings", "maintenance"));
        if (maintSnap.exists()) {
          document.getElementById('maintenance-enabled').checked = maintSnap.data().enabled === true;
        }
      } catch (e) { console.error(e); }
    }
    loadSettings();

    window.saveSettings = async function() {
      const enabled = document.getElementById('ticker-enabled').checked;
      const customText = document.getElementById('ticker-text').value.trim();
      try {
        await setDoc(doc(db, "settings", "ticker"), { enabled: enabled, customText: customText });
        showToast('Настройки бегущей строки сохранены!', 'success');
      } catch (e) { showToast('Ошибка сохранения', 'error'); }
    };

    window.saveMaintenance = async function() {
      const enabled = document.getElementById('maintenance-enabled').checked;
      try {
        await setDoc(doc(db, "settings", "maintenance"), { enabled: enabled });
        showToast(enabled ? 'Режим обслуживания ВКЛЮЧЕН' : 'Режим обслуживания ВЫКЛЮЧЕН', 'success');
      } catch (e) { showToast('Ошибка', 'error'); }
    };
  </script>
</body>
</html>
