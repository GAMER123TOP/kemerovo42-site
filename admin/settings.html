<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки | Кемерово 42</title>
    <!-- Подключаем РОДНОЙ стиль админки -->
    <link rel="stylesheet" href="admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Дополнительные стили ТОЛЬКО для форм, чтобы они вписались в .card */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
        
        .form-group { margin-bottom: 20px; }
        
        label { 
            display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.85rem; 
            color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; 
        }
        
        input[type="text"], input[type="number"], textarea, select { 
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; 
            font-family: inherit; font-size: 0.95rem; background: white; color: var(--text-main);
            transition: all 0.2s; box-sizing: border-box;
        }
        input:focus, textarea:focus, select:focus { 
            outline: none; border-color: var(--accent); 
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15); 
        }
        textarea { resize: vertical; min-height: 120px; line-height: 1.5; }
        
        /* Бейджи белого списка в стиле админки */
        .wl-tags-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; min-height: 40px; }
        .wl-badge { 
            background: var(--bg-secondary); border: 1px solid var(--border); padding: 6px 12px; 
            border-radius: 6px; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; 
            color: var(--text-main); font-weight: 500;
        }
        .wl-badge button { 
            background: none; border: none; color: #ef4444; cursor: pointer; 
            font-size: 1rem; line-height: 1; padding: 0; opacity: 0.7; transition: 0.2s;
        }
        .wl-badge button:hover { opacity: 1; transform: scale(1.1); }
        
        .empty-wl { color: var(--text-muted); font-size: 0.9rem; font-style: italic; padding: 10px 0; }

        /* Toggle switch адаптированный под админку */
        .toggle-wrapper { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .toggle-switch { position: relative; width: 50px; height: 26px; display: inline-block; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(24px); }
    </style>
</head>
<body>
    <!-- Подключаем РОДНОЙ сайдбар -->
    <div id="sidebar-container"></div>

    <main class="main-content">
        <div class="page-header">
            <h1 class="page-title">Настройки сайта</h1>
            <button onclick="saveAllSettings()" class="btn-create" style="background: var(--accent); color: #0f172a; border: none;">
                <i class="fas fa-save"></i> Сохранить
            </button>
        </div>

        <!-- Карточка 1: Режим обслуживания -->
        <div class="card" style="margin-bottom: 24px;">
            <h3 style="margin-bottom: 20px; font-family: 'Unbounded'; font-size: 1.2rem; display: flex; align-items: center; gap: 10px;">
                <i class="fas fa-tools" style="color: var(--accent);"></i> Режим обслуживания
            </h3>
            
            <div class="toggle-wrapper">
                <span style="font-weight: 600; color: var(--text-main);">Включить технический доступ</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="maint-enabled">
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="form-group">
                <label>Текст заглушки (поддерживает HTML)</label>
                <textarea id="maint-text" placeholder="<h2>Сайт на реконструкции</h2><p>Мы скоро вернемся!</p>"></textarea>
            </div>
        </div>

        <!-- Карточка 2: Бегущая строка -->
        <div class="card" style="margin-bottom: 24px;">
            <h3 style="margin-bottom: 20px; font-family: 'Unbounded'; font-size: 1.2rem; display: flex; align-items: center; gap: 10px;">
                <i class="fas fa-tv" style="color: var(--accent);"></i> Бегущая строка
            </h3>
            
            <div class="toggle-wrapper">
                <span style="font-weight: 600; color: var(--text-main);">Показывать бегущую строку</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="ticker-enabled">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Скорость (секунды на круг)</label>
                    <input type="number" id="ticker-speed" min="5" max="120" value="30">
                </div>
                <div class="form-group">
                    <label>Режим заполнения</label>
                    <select id="ticker-mode">
                        <option value="auto">Авто (последние 5 новостей)</option>
                        <option value="custom">Свой текст</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label>Кастомный текст</label>
                <input type="text" id="ticker-custom" placeholder="Введите текст бегущей строки...">
            </div>
        </div>

        <!-- Карточка 3: Белый список -->
        <div class="card" style="margin-bottom: 24px;">
            <h3 style="margin-bottom: 10px; font-family: 'Unbounded'; font-size: 1.2rem; display: flex; align-items: center; gap: 10px;">
                <i class="fas fa-user-shield" style="color: var(--accent);"></i> Белый список доступа
            </h3>
            <p style="color: var(--text-muted); margin-bottom: 20px; font-size: 0.9rem;">
                Пользователи из этого списка смогут заходить на сайт даже при включенном режиме обслуживания.
            </p>
            
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <input type="text" id="wl-email" placeholder="Email пользователя..." style="flex: 1;">
                <button onclick="addToWhitelist()" class="btn-create" style="padding: 12px 20px;">
                    <i class="fas fa-plus"></i> Добавить
                </button>
            </div>
            <div class="wl-tags-container" id="wl-container">
                <span class="empty-wl">Загрузка списка...</span>
            </div>
        </div>
    </main>

    <script type="module">
        // ИСПОЛЬЗУЕМ РОДНЫЕ ИМПОРТЫ АДМИНКИ
        import { renderSidebar } from './sidebar.js';
        import { db, auth } from '../firebase-config.js';
        import { showToast, showConfirm } from '../ui.js';
        import { getDoc, doc, setDoc, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { collection, getDocs, query, where, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Рендерим сайдбар с активным пунктом 'settings'
        renderSidebar('settings');

        let currentWhitelist = [];

        // Проверка прав и загрузка
        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = '/kemerovo42-site/admin/login.html'; return; }
            const token = await user.getIdTokenResult();
            if (!token.claims.admin) { 
                showToast("У вас нет прав администратора", 'error');
                setTimeout(() => window.location.href = '/kemerovo42-site/index.html', 2000);
            } else {
                loadSettings();
            }
        });

        async function loadSettings() {
            try {
                // Maintenance
                const maintSnap = await getDoc(doc(db, "settings", "maintenance"));
                if (maintSnap.exists()) {
                    document.getElementById('maint-enabled').checked = maintSnap.data().enabled || false;
                    document.getElementById('maint-text').value = maintSnap.data().text || '';
                }

                // Ticker
                const tickerSnap = await getDoc(doc(db, "settings", "ticker"));
                if (tickerSnap.exists()) {
                    const tData = tickerSnap.data();
                    document.getElementById('ticker-enabled').checked = tData.enabled !== false;
                    document.getElementById('ticker-speed').value = tData.speed || 30;
                    document.getElementById('ticker-mode').value = tData.mode || 'auto';
                    document.getElementById('ticker-custom').value = tData.customText || '';
                }

                // Whitelist
                const wlSnap = await getDoc(doc(db, "settings", "maintenance_whitelist"));
                if (wlSnap.exists()) {
                    currentWhitelist = wlSnap.data().uids || [];
                    renderWhitelistTags();
                } else {
                    document.getElementById('wl-container').innerHTML = '<span class="empty-wl">Список пуст</span>';
                }
            } catch (e) {
                console.error(e);
                showToast("Ошибка загрузки настроек", 'error');
            }
        }

        async function addToWhitelist() {
            const email = document.getElementById('wl-email').value.trim();
            if (!email) return showToast("Введите email", 'error');

            try {
                const q = query(collection(db, "users"), where("email", "==", email));
                const snap = await getDocs(q);
                
                if (snap.empty) return showToast("Пользователь не найден", 'error');
                
                const uid = snap.docs[0].id;
                if (currentWhitelist.includes(uid)) return showToast("Уже в списке", 'info');

                await setDoc(doc(db, "settings", "maintenance_whitelist"), { uids: arrayUnion(uid) }, { merge: true });
                currentWhitelist.push(uid);
                renderWhitelistTags();
                document.getElementById('wl-email').value = '';
                showToast("Добавлен в белый список", 'success');
            } catch (e) {
                showToast("Ошибка поиска", 'error');
            }
        }

        async function removeFromWhitelist(uid) {
            showConfirm("Удалить из списка?", "Пользователь потеряет доступ во время техработ.", async () => {
                await updateDoc(doc(db, "settings", "maintenance_whitelist"), { uids: arrayRemove(uid) });
                currentWhitelist = currentWhitelist.filter(id => id !== uid);
                renderWhitelistTags();
                showToast("Удален", 'success');
            });
        }

        async function renderWhitelistTags() {
            const container = document.getElementById('wl-container');
            container.innerHTML = '';
            
            if (currentWhitelist.length === 0) {
                container.innerHTML = '<span class="empty-wl">Список пуст</span>';
                return;
            }

            for (const uid of currentWhitelist) {
                try {
                    const uSnap = await getDoc(doc(db, "users", uid));
                    const userData = uSnap.exists() ? uSnap.data() : { displayName: uid.slice(0,8)+'...' };
                    const name = userData.displayName || userData.email || uid;
                    
                    const tag = document.createElement('div');
                    tag.className = 'wl-badge';
                    tag.innerHTML = `<span>${name}</span> <button onclick="removeFromWhitelist('${uid}')">&times;</button>`;
                    container.appendChild(tag);
                } catch(e) {}
            }
        }

        window.saveAllSettings = async function() {
            const btn = document.querySelector('.btn-create'); // Кнопка сохранения теперь имеет класс btn-create
            const originalHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ...';

            try {
                await setDoc(doc(db, "settings", "maintenance"), {
                    enabled: document.getElementById('maint-enabled').checked,
                    text: document.getElementById('maint-text').value
                }, { merge: true });

                await setDoc(doc(db, "settings", "ticker"), {
                    enabled: document.getElementById('ticker-enabled').checked,
                    speed: Number(document.getElementById('ticker-speed').value),
                    mode: document.getElementById('ticker-mode').value,
                    customText: document.getElementById('ticker-custom').value
                }, { merge: true });

                showToast("Настройки сохранены!", 'success');
            } catch (e) {
                console.error(e);
                showToast("Ошибка сохранения", 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHTML;
            }
        };
    </script>
</body>
</html>
