<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Рабочий стол | Кемерово 42</title>
  <style>
    body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
    .admin-box { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    input, textarea { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
    button { padding: 10px 20px; background: #d4af37; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; }
    .header { display: flex; justify-content: space-between; align-items: center; max-width: 600px; margin: 0 auto 20px auto; }
  </style>
</head>
<body>
  <div class="header">
    <h2>Редакция</h2>
    <div><span id="welcome"></span> | <button onclick="logout()" style="background: #e74c3c; color: white;">Выйти</button></div>
  </div>

  <div class="admin-box">
    <h3>Новая новость</h3>
    <input type="text" id="title" placeholder="Заголовок">
    <input type="text" id="tag" placeholder="Тег (Город, МВД, Криминал)">
    <input type="text" id="image" placeholder="Ссылка на картинку (URL)">
    <input type="text" id="description" placeholder="Краткое описание">
    <textarea id="text" placeholder="Полный текст" style="height: 150px;"></textarea>
    <button onclick="publish()">Опубликовать</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = { /* ТВОЙ КОНФИГ */ };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const currentUser = localStorage.getItem('loggedInUser');
    if (!currentUser) {
        window.location.href = 'login.html';
    } else {
        document.getElementById('welcome').innerText = "Вы вошли как: " + currentUser;
    }

    window.logout = function() {
        localStorage.removeItem('loggedInUser');
        window.location.href = 'login.html';
    }

    window.publish = async function() {
        const title = document.getElementById('title').value;
        const text = document.getElementById('text').value;

        if(!title || !text) return alert("Заполните заголовок и текст!");

        await addDoc(collection(db, "news"), {
            title: title,
            tag: document.getElementById('tag').value || 'Новость',
            image: document.getElementById('image').value,
            description: document.getElementById('description').value,
            text: text,
            author: currentUser,
            date: new Date()
        });
        
        alert("Новость опубликована!");
        document.getElementById('title').value = '';
        document.getElementById('tag').value = '';
        document.getElementById('image').value = '';
        document.getElementById('description').value = '';
        document.getElementById('text').value = '';
    }
  </script>
</body>
</html>
