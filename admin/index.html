<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Панель управления | Кемерово 42</title>
  <link rel="stylesheet" href="admin-style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid var(--border); display: flex; align-items: center; gap: 20px; }
    .stat-icon { width: 60px; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }
    .stat-info h4 { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
    .stat-info .number { font-size: 2rem; font-weight: 800; font-family: 'Montserrat', sans-serif; line-height: 1; }
    
    .two-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .mini-list { list-style: none; }
    .mini-list li { padding: 12px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
    .mini-list li:last-child { border-bottom: none; }
    .mini-list a { color: var(--sidebar-bg); text-decoration: none; font-weight: 600; }
    .mini-list a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Панель управления</h1>
      <a href="create.html" class="btn-create"><i class="fas fa-plus"></i> Создать новость</a>
    </div>

    <!-- Статистика -->
    <div class="dashboard-grid">
      <div class="stat-card">
        <div class="stat-icon" style="background: #dcfce7; color: #166534;"><i class="fas fa-newspaper"></i></div>
        <div class="stat-info">
          <h4>Всего новостей</h4>
          <div class="number" id="stat-news">0</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background: #fef08a; color: #854d0e;"><i class="fas fa-file-alt"></i></div>
        <div class="stat-info">
          <h4>Черновики</h4>
          <div class="number" id="stat-drafts">0</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background: #e0f2fe; color: #0369a1;"><i class="fas fa-users"></i></div>
        <div class="stat-info">
          <h4>Пользователи</h4>
          <div class="number" id="stat-users">0</div>
        </div>
      </div>
    </div>

    <div class="two-cols">
        <!-- Последние комментарии -->
        <div class="card">
            <h3 style="margin-bottom: 15px; font-family: 'Montserrat';"><i class="fas fa-comments" style="color: #3b82f6;"></i> Последние комментарии</h3>
            <ul class="mini-list" id="recent-comments">
                <li style="color: var(--text-muted); text-align: center;">Загрузка...</li>
            </ul>
        </div>

        <!-- Новые предложки -->
        <div class="card">
            <h3 style="margin-bottom: 15px; font-family: 'Montserrat';"><i class="fas fa-bullhorn" style="color: #ef4444;"></i> Новые предложки</h3>
            <ul class="mini-list" id="recent-suggestions">
                <li style="color: var(--text-muted); text-align: center;">Загрузка...</li>
            </ul>
        </div>
    </div>
  </main>

  <script type="module">
    import { renderSidebar } from './sidebar.js';
    import { firebaseConfig } from '../firebase-config.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy, limit, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    renderSidebar('dashboard');
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    onAuthStateChanged(auth, async (user) => {
      if (!user) return;
      const token = await user.getIdTokenResult();
      let role = token.claims.admin ? 'admin' : 'editor';

      const userRef = doc(db, "users", user.uid);
      const userSnap = await getDoc(userRef);
      if (!userSnap.exists()) await setDoc(userRef, { email: user.email, role: role, displayName: user.email.split('@')[0] });
      else if (!userSnap.data().email || !userSnap.data().role) await setDoc(userRef, { email: user.email, role: role }, { merge: true });
      
      loadStats();
      loadRecentComments();
      loadRecentSuggestions();
    });

    async function loadStats() {
      try {
        const newsSnap = await getDocs(collection(db, "news"));
        let published = 0;
        let drafts = 0;
        newsSnap.forEach(doc => {
          const s = doc.data().status;
          if (s === 'draft') drafts++;
          else if (s !== 'archived') published++;
        });
        const usersSnap = await getDocs(collection(db, "users"));

        document.getElementById('stat-news').innerText = published;
        document.getElementById('stat-drafts').innerText = drafts;
        document.getElementById('stat-users').innerText = usersSnap.size;
      } catch (e) { console.error("Ошибка статистики:", e); }
    }

    async function loadRecentComments() {
        const list = document.getElementById('recent-comments');
        try {
            const q = query(collection(db, "comments"), orderBy("date", "desc"), limit(5));
            const snapshot = await getDocs(q);
            list.innerHTML = '';
            if (snapshot.empty) { list.innerHTML = '<li style="color: var(--text-muted); text-align: center;">Комментариев нет</li>'; return; }
            
            snapshot.forEach(doc => {
                const d = doc.data();
                list.innerHTML += `
                    <li>
                        <div style="flex: 1; padding-right: 10px;">
                            <strong>${d.author}:</strong> <span style="color: var(--text-muted);">${d.text.substring(0, 40)}...</span>
                        </div>
                        <a href="../article.html?id=${d.newsId}" target="_blank">Открыть</a>
                    </li>
                `;
            });
        } catch(e) { list.innerHTML = '<li style="color:red;">Ошибка</li>'; }
    }

    async function loadRecentSuggestions() {
        const list = document.getElementById('recent-suggestions');
        try {
            const q = query(collection(db, "suggestions"), orderBy("date", "desc"), limit(5));
            const snapshot = await getDocs(q);
            list.innerHTML = '';
            if (snapshot.empty) { list.innerHTML = '<li style="color: var(--text-muted); text-align: center;">Новых предложек нет</li>'; return; }
            
            snapshot.forEach(doc => {
                const d = doc.data();
                list.innerHTML += `
                    <li>
                        <div style="flex: 1; padding-right: 10px;">
                            <strong>${d.title}</strong><br>
                            <span style="font-size: 0.8rem; color: var(--text-muted);">От: ${d.author}</span>
                        </div>
                        <a href="suggestions.html">Читать</a>
                    </li>
                `;
            });
        } catch(e) { list.innerHTML = '<li style="color:red;">Ошибка</li>'; }
    }
  </script>
</body>
</html>
