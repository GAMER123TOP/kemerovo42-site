<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Редактор новости | Кемерово 42</title>
  <link rel="stylesheet" href="admin-style.css">
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    #editor-container { height: 400px; margin-bottom: 20px; background: white; border-radius: 8px; }
    .ql-toolbar { border-radius: 8px 8px 0 0; border-color: var(--border) !important; }
    .ql-container { border-color: var(--border) !important; border-radius: 0 0 8px 8px; font-family: 'Inter', sans-serif; font-size: 1rem;}
    .btn-draft { background: #e2e8f0; color: #0f172a; margin-left: 10px; }
    .btn-draft:hover { background: #cbd5e1; }
    .upload-row { display: flex; gap: 10px; align-items: center; }
    .upload-status { font-size: 0.85rem; color: var(--text-muted); }
    
    /* Стили для сетки картинок ВНУТРИ редактора */
    .ql-editor img { max-width: 100%; border-radius: 8px; display: inline-block; margin: 5px; width: calc(33.33% - 10px); vertical-align: top; object-fit: cover; height: 150px; }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title" id="page-title">Новая новость</h1>
    </div>

    <div class="card">
      <div class="form-group">
        <label>Заголовок</label>
        <input type="text" id="title" class="form-control" placeholder="Введите заголовок...">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div class="form-group">
          <label>Рубрика</label>
          <select id="tag" class="form-control">
            <option value="Новость">Обычная новость</option>
          </select>
        </div>
        <div class="form-group">
          <label>Главная обложка (для карточки на главной)</label>
          <div class="upload-row">
            <input type="text" id="image" class="form-control" placeholder="Вставьте ссылку или загрузите файл">
            <input type="file" id="image-file" accept="image/*" style="display: none;" onchange="uploadCoverToImgur(this)">
            <button type="button" class="btn-create" style="padding: 10px 15px; margin: 0;" onclick="document.getElementById('image-file').click()">
              <i class="fas fa-upload"></i> Загрузить
            </button>
          </div>
          <div class="upload-status" id="upload-status"></div>
        </div>
      </div>

      <div class="form-group">
        <label>Краткое описание</label>
        <input type="text" id="description" class="form-control" placeholder="Пара предложений...">
      </div>

      <div class="form-group">
        <label>Текст новости (для добавления галереи используйте иконку картинки в панели редактора)</label>
        <div id="editor-container"></div>
      </div>

      <div style="display: flex; gap: 10px;">
        <button onclick="saveNews('published')" class="btn-create" style="flex: 2; justify-content: center; font-size: 1.1rem; padding: 15px;">
          <i class="fas fa-paper-plane"></i> Опубликовать
        </button>
        <button onclick="saveNews('draft')" class="btn-create btn-draft" style="flex: 1; justify-content: center; font-size: 1.1rem; padding: 15px;">
          <i class="fas fa-save"></i> В черновик
        </button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
  <script type="module">
    import { renderSidebar } from './sidebar.js';
    import { firebaseConfig } from '../firebase-config.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    renderSidebar('create');
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // ⚠️ ВСТАВЬ СЮДА СВОЙ CLIENT ID ОТ IMGUR
    const IMGUR_CLIENT_ID = 'ТВОЙ_CLIENT_ID'; 

    // --- ОБРАБОТЧИК КАРТИНОК ДЛЯ QUILL ---
    function imageHandler() {
        const input = document.createElement('input');
        input.setAttribute('type', 'file');
        input.setAttribute('accept', 'image/*');
        input.click();

        input.onchange = async () => {
            const file = input.files[0];
            if (!file) return;

            const range = quill.getSelection(true);
            quill.insertText(range.index, '⏳ Загрузка картинки...', 'user');
            
            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch('https://api.imgur.com/3/image', {
                    method: 'POST',
                    headers: { 'Authorization': `Client-ID ${IMGUR_CLIENT_ID}` },
                    body: formData
                });

                const result = await response.json();
                if (result.success) {
                    quill.deleteText(range.index, 21);
                    quill.insertEmbed(range.index, 'image', result.data.link);
                    quill.setSelection(range.index + 1); 
                } else {
                    quill.deleteText(range.index, 21);
                    alert('Ошибка загрузки на Imgur. Проверьте Client ID.');
                }
            } catch (error) {
                quill.deleteText(range.index, 21);
                alert('Ошибка сети при загрузке');
            }
        };
    }

    const quill = new Quill('#editor-container', {
      theme: 'snow', 
      placeholder: 'Начните писать текст...',
      modules: { 
        toolbar: { 
            container: [
                ['bold', 'italic', 'underline'], 
                [{ 'header': 2 }], 
                [{ 'list': 'ordered'}, { 'list': 'bullet' }], 
                ['link'], 
                ['image'], // Кнопка картинки
                ['clean'] 
            ],
            handlers: { 'image': imageHandler }
        } 
      }
    });

    const urlParams = new URLSearchParams(window.location.search);
    const editId = urlParams.get('id');
    let currentUserDisplayName = 'Редакция';

    onAuthStateChanged(auth, async (user) => {
      if (!user) return;
      const userSnap = await getDoc(doc(db, "users", user.uid));
      if (userSnap.exists()) currentUserDisplayName = userSnap.data().displayName || user.email.split('@')[0];
    });

    async function loadCategoriesToSelect() {
        const tagSelect = document.getElementById('tag');
        const snapshot = await getDocs(collection(db, "categories"));
        snapshot.forEach(doc => {
            const cat = doc.data();
            const option = document.createElement('option');
            option.value = cat.name;
            option.textContent = cat.name;
            tagSelect.appendChild(option);
        });
    }
    loadCategoriesToSelect();

    if (editId) {
        document.getElementById('page-title').innerText = 'Редактирование новости';
        document.querySelector('button[onclick="saveNews(\'published\')"]').innerHTML = '<i class="fas fa-save"></i> Сохранить и опубликовать';
        
        getDoc(doc(db, "news", editId)).then(docSnap => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('title').value = data.title || '';
                document.getElementById('image').value = data.image || '';
                document.getElementById('description').value = data.description || '';
                
                setTimeout(() => {
                    const tagSelect = document.getElementById('tag');
                    if (data.tag) tagSelect.value = data.tag;
                }, 500);

                if (data.text) quill.clipboard.dangerouslyPasteHTML(data.text);
            } else {
                alert("Новость не найдена");
                window.location.href = 'posts.html';
            }
        });
    }

    // --- ЗАГРУЗКА ОБЛОЖКИ ---
    window.uploadCoverToImgur = async function(input) {
        if (!input.files || input.files.length === 0) return;
        const file = input.files[0];
        const statusDiv = document.getElementById('upload-status');
        statusDiv.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Загрузка...';
        
        const formData = new FormData();
        formData.append('image', file);

        try {
            const response = await fetch('https://api.imgur.com/3/image', {
                method: 'POST',
                headers: { 'Authorization': `Client-ID ${IMGUR_CLIENT_ID}` },
                body: formData
            });
            const result = await response.json();
            if (result.success) {
                document.getElementById('image').value = result.data.link;
                statusDiv.innerHTML = '<span style="color: #10b981;"><i class="fas fa-check"></i> Успешно!</span>';
            } else { statusDiv.innerHTML = '<span style="color: #ef4444;">Ошибка загрузки</span>'; }
        } catch (error) { statusDiv.innerHTML = '<span style="color: #ef4444;">Ошибка сети</span>'; }
    };

    window.saveNews = async function(status) {
      const title = document.getElementById('title').value;
      const text = quill.root.innerHTML;
      
      if(!title || quill.getText().trim() === '') return alert("Заполните заголовок и текст!");

      const newsData = {
        title: title, 
        tag: document.getElementById('tag').value,
        image: document.getElementById('image').value || '',
        description: document.getElementById('description').value || '',
        text: text, 
        author: currentUserDisplayName,
        status: status
      };

      try {
        if (editId) {
          await updateDoc(doc(db, "news", editId), newsData);
          alert(status === 'draft' ? "Черновик сохранен!" : "Новость обновлена!");
        } else {
          newsData.date = serverTimestamp();
          newsData.views = 0;
          await addDoc(collection(db, "news"), newsData);
          alert(status === 'draft' ? "Черновик создан!" : "Новость опубликована!");
        }
        window.location.href = 'posts.html';
      } catch (error) { console.error(error); alert("Ошибка сохранения!"); }
    };
  </script>
</body>
</html>
