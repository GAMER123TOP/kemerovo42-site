<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Добавить новость | Кемерово 42</title>
  <link rel="stylesheet" href="admin-style.css">
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    #editor-container { height: 300px; margin-bottom: 20px; background: white; border-radius: 8px; }
    .ql-toolbar { border-radius: 8px 8px 0 0; border-color: var(--border) !important; }
    .ql-container { border-color: var(--border) !important; border-radius: 0 0 8px 8px; font-family: 'Inter', sans-serif; font-size: 1rem;}
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-logo">КЕМЕРОВО <span>42</span></div>
    <ul class="sidebar-menu">
      <li><a href="index.html"><i class="fas fa-home"></i> Дашборд</a></li>
      <li><a href="posts.html"><i class="fas fa-newspaper"></i> Записи (Новости)</a></li>
      <li><a href="create.html" class="active"><i class="fas fa-plus-circle"></i> Добавить новость</a></li>
      <li><a href="users.html" id="menu-users" style="display: none;"><i class="fas fa-users"></i> Пользователи</a></li>
      <li><a href="../index.html"><i class="fas fa-external-link-alt"></i> На сайт</a></li>
    </ul>
    <div class="sidebar-user">
      <img id="sb-avatar" src="https://upload.wikimedia.org/wikipedia/commons/7/7c/Profile_avatar_placeholder_large.png" alt="Аватар">
      <div class="sidebar-user-info">
        <span class="sidebar-user-name" id="sb-name">Загрузка...</span>
        <span class="sidebar-user-role" id="sb-role">...</span>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">Новая новость</h1>
    </div>

    <div class="card">
      <div class="form-group">
        <label>Заголовок</label>
        <input type="text" id="title" class="form-control" placeholder="Введите заголовок...">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
        <div class="form-group">
          <label>Рубрика</label>
          <select id="tag" class="form-control">
            <option value="Новость">Обычная новость</option>
            <option value="Криминал">Криминал</option>
            <option value="Город">Город</option>
            <option value="О МВД">О МВД</option>
          </select>
        </div>
        <div class="form-group">
          <label>Ссылка на картинку (URL)</label>
          <input type="text" id="image" class="form-control" placeholder="https://...">
        </div>
      </div>

      <div class="form-group">
        <label>Краткое описание</label>
        <input type="text" id="description" class="form-control" placeholder="Пара предложений для карточки...">
      </div>

      <div class="form-group">
        <label>Текст новости</label>
        <div id="editor-container"></div>
      </div>

      <button onclick="publish()" class="btn-create" style="width: 100%; justify-content: center; font-size: 1.1rem; padding: 15px;">
        <i class="fas fa-paper-plane"></i> Опубликовать
      </button>
    </div>
  </main>

  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  <script type="module">
    import { firebaseConfig } from '../firebase-config.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const quill = new Quill('#editor-container', {
      theme: 'snow',
      placeholder: 'Начните писать текст...',
      modules: {
        toolbar: [
          ['bold', 'italic', 'underline'],
          [{ 'header': 2 }],
          [{ 'list': 'ordered'}, { 'list': 'bullet' }],
          ['link'],
          ['clean']
        ]
      }
    });

    let currentUserEmail = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      currentUserEmail = user.email;
      
      const token = await user.getIdTokenResult();
      const role = token.claims.admin ? 'admin' : (token.claims.editor ? 'editor' : 'journalist');
      document.getElementById('sb-name').innerText = user.email.split('@')[0];
      document.getElementById('sb-role').innerText = role === 'admin' ? 'Администратор' : 'Редактор';
      if (role === 'admin') document.getElementById('menu-users').style.display = 'block';

      const userSnap = await getDoc(doc(db, "users", user.uid));
      if (userSnap.exists() && userSnap.data().photoURL) {
        document.getElementById('sb-avatar').src = userSnap.data().photoURL;
      }
    });

    window.publish = async function() {
      const title = document.getElementById('title').value;
      const text = quill.root.innerHTML;
      
      if(!title || quill.getText().trim() === '') return alert("Заполните заголовок и текст!");

      try {
        await addDoc(collection(db, "news"), {
          title: title,
          tag: document.getElementById('tag').value,
          image: document.getElementById('image').value || '',
          description: document.getElementById('description').value || '',
          text: text,
          author: currentUserEmail.split('@')[0],
          date: new Date(),
          views: 0
        });
        
        alert("Новость опубликована!");
        window.location.href = 'posts.html';
      } catch (error) {
        console.error(error);
        alert("Ошибка публикации! У вас есть права редактора?");
      }
    };
  </script>
</body>
</html>
