<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Технические работы | Кемерово 42</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; height: 100vh; background: #0f172a; color: white; text-align: center; font-family: 'Inter', sans-serif; margin: 0; }
        .box { background: #1e293b; padding: 50px; border-radius: 16px; border: 2px solid var(--accent); max-width: 500px; }
        h1 { font-family: 'Unbounded', sans-serif; color: var(--accent); margin-bottom: 20px; }
        p { color: #94a3b8; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="box" id="maintenance-content">
        <i class="fas fa-tools" style="font-size: 3rem; color: var(--accent); margin-bottom: 20px;"></i>
        <h1>Идут технические работы</h1>
        <p>Редакция «Кемерово 42» обновляет портал. Мы скоро вернемся!</p>
    </div>

    <script type="module">
        import { firebaseConfig } from './firebase-config.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadMaintText() {
            try {
                const snap = await getDoc(doc(db, "settings", "maintenance"));
                if (snap.exists() && snap.data().text) {
                    document.getElementById('maintenance-content').innerHTML = snap.data().text;
                }
            } catch(e) { console.log(e); }
        }
        loadMaintText();
    </script>
</body>
</html>
