<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статья | Кемерово 42</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- DOMPurify для безопасности вывода HTML -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
    <style>
        .action-buttons { display: flex !important; gap: 10px; margin-top: 30px; flex-wrap: wrap; align-items: center; border-top: 1px solid #e2e8f0; padding-top: 20px; }
        
        .btn-action, .like-btn, .save-btn { 
            padding: 10px 20px !important; border-radius: 8px !important; border: 1px solid #cbd5e1 !important; 
            background: #f1f5f9 !important; color: #0f172a !important; font-weight: 600 !important; 
            cursor: pointer !important; display: inline-flex !important; align-items: center !important; 
            gap: 8px !important; text-decoration: none !important; font-size: 0.9rem !important;
            font-family: 'Inter', sans-serif !important; transition: 0.2s !important;
        }
        .btn-action:hover, .like-btn:hover, .save-btn:hover { background: #e2e8f0 !important; border-color: #94a3b8 !important; }
        .btn-edit-article { background: #3b82f6 !important; color: white !important; border-color: #3b82f6 !important; }
        .btn-edit-article:hover { background: #2563eb !important; }

        .article-text { font-size: 1.1rem; line-height: 1.8; color: var(--text-color); word-wrap: break-word; white-space: normal; margin-bottom: 30px; }
        .article-text p { margin-bottom: 20px; }
        .article-text ol { list-style-type: none !important; padding-left: 20px; margin-bottom: 20px; }
        .article-text li { position: relative; margin-bottom: 8px; padding-left: 20px; }
        .article-text li[data-list="bullet"]::before { content: "•"; position: absolute; left: 0; color: var(--text-color); font-weight: bold; font-size: 1.2em; line-height: 1; }
        .article-text li[data-list="ordered"] { list-style-type: decimal !important; padding-left: 0; }
        .article-text li[data-list="ordered"]::before { content: none; }
        .article-text .ql-ui { display: none; }
        
        .author-link { color: var(--text-color); text-decoration: none; font-weight: 600; transition: 0.2s; }
        .author-link:hover { color: var(--accent); }
        
        .comments-section { margin-top: 40px; border-top: 1px solid var(--border); padding-top: 30px; }
        .comments-section h3 { font-family: 'Montserrat'; margin-bottom: 20px; font-size: 1.3rem; }
        .comment-form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; margin-top: 20px; }
        .comment-form input, .comment-form textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; }
        .comment-form textarea { resize: vertical; min-height: 80px; }
        .comment-form button { align-self: flex-start; padding: 10px 20px; background: var(--accent); color: #0f172a; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .comment-item { background: #f8fafc; padding: 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #e2e8f0; }
        .comment-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem; color: var(--text-muted); }
        .comment-author { font-weight: 700; color: var(--header-bg); }
        .comment-text { font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; }
        .btn-del-comment { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; gap: 4px; margin-top: 10px; padding: 0; }
        .btn-del-comment:hover { text-decoration: underline; }

        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 30px; margin-bottom: 30px; }
        .gallery-grid img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; cursor: pointer; transition: transform 0.2s; }
        .gallery-grid img:hover { transform: scale(1.02); }
        @media (max-width: 768px) { .gallery-grid { grid-template-columns: 1fr; } .gallery-grid img { height: 250px; } }

        .lightbox { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.9); backdrop-filter: blur(5px); justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease; }
        .lightbox.active { display: flex; opacity: 1; }
        .lightbox img { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 4px; box-shadow: 0 0 20px rgba(0,0,0,0.5); transition: transform 0.3s ease; }
        .lightbox-close { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; transition: 0.2s; z-index: 10000; }
        .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); color: #fff; font-size: 40px; cursor: pointer; padding: 10px; transition: 0.2s; z-index: 10000; user-select: none; }
        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }
        .lightbox-counter { position: absolute; bottom: 20px; color: #fff; font-size: 1rem; font-family: 'Montserrat', sans-serif; letter-spacing: 1px; z-index: 10000; }
        
        #scroll-top-btn {
            position: fixed; bottom: 30px; right: 30px; background: var(--accent); color: #0f172a;
            border: none; width: 50px; height: 50px; border-radius: 50%; font-size: 1.2rem;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: none; z-index: 1000;
            transition: 0.3s;
        }
        #scroll-top-btn:hover { transform: translateY(-5px); }
    </style>
</head>
<body>

    <div id="header-container"></div>

    <div class="article-container" id="article-box"><p>Загрузка...</p></div>

    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <span class="lightbox-nav lightbox-prev" onclick="changeLightboxImage(-1)">&#10094;</span>
        <img id="lightbox-img" src="" alt="Полноэкранное фото">
        <span class="lightbox-nav lightbox-next" onclick="changeLightboxImage(1)">&#10095;</span>
        <div class="lightbox-counter" id="lightbox-counter">1 / 1</div>
    </div>

    <button id="scroll-top-btn" title="Наверх"><i class="fas fa-arrow-up"></i></button>

    <script type="module">
        import { renderHeader } from './header.js';
        import { db, auth } from './firebase-config.js'; // ЕДИНЫЙ ИМПОРТ
        import { showToast, showConfirm } from './ui.js';
        import { getDoc, doc, updateDoc, increment, arrayUnion, arrayRemove, collection, addDoc, query, orderBy, onSnapshot, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        renderHeader();

        const articleBox = document.getElementById('article-box');
        const urlParams = new URLSearchParams(window.location.search);
        const articleParam = urlParams.get('article');
        
        if (!articleParam) {
            articleBox.innerHTML = '<p style="text-align:center; padding: 40px;">Статья не найдена</p>';
        }

        const articleId = articleParam.split('-').pop();
        let currentArticle = null;
        let currentUser = null;
        let galleryImages = [];
        let currentImageIndex = 0;

        onAuthStateChanged(auth, (user) => { currentUser = user; });

        async function loadArticle() {
            try {
                const docSnap = await getDoc(doc(db, "news", articleId));
                if (!docSnap.exists()) {
                    articleBox.innerHTML = '<p style="text-align:center; padding: 40px;">Статья не найдена</p>';
                    return;
                }

                currentArticle = { id: docSnap.id, ...docSnap.data() };
                
                // --- ЗАЩИТА ОТ НАКРУТКИ ПРОСМОТРОВ (LocalStorage) ---
                const viewedKey = `viewed_${articleId}`;
                if (!localStorage.getItem(viewedKey)) {
                    await updateDoc(doc(db, "news", articleId), { views: increment(1) });
                    localStorage.setItem(viewedKey, 'true');
                }
                // ---------------------------------------------------

                const data = currentArticle;
                const dateStr = formatDateTime(data.date);
                const viewsCount = data.views ? Number(data.views) : 0;

                // --- УМНАЯ ГАЛЕРЕЯ (БЕЗ ДУБЛЕЙ) ---
                let rawGallery = [];
                if (data.gallery && Array.isArray(data.gallery)) {
                    data.gallery.forEach(imgUrl => {
                        // Добавляем только если это НЕ главное фото
                        if (imgUrl !== data.image) {
                            rawGallery.push(imgUrl);
                        }
                    });
                }
                // Главное фото всегда идет первым в массиве для лайтбокса
                if (data.image) {
                    rawGallery.unshift(data.image);
                }
                galleryImages = rawGallery; 
                // ----------------------------------

                let galleryHTML = '';
                // Рисуем сетку только если есть дополнительные фото (больше 1 всего)
                if (galleryImages.length > 1) {
                    galleryHTML = `<div class="gallery-grid">`;
                    // Начинаем с 1, чтобы не дублировать главное фото в сетке под собой
                    for (let i = 1; i < galleryImages.length; i++) {
                        galleryHTML += `<img src="${galleryImages[i]}" onclick="openLightbox(${i})" loading="lazy">`;
                    }
                    galleryHTML += `</div>`;
                }

                // --- ТЕКСТ ИЗ ПРАВИЛЬНОГО ПОЛЯ ---
                const articleContent = data.text || data.content || data.body || '<p>Текст статьи временно недоступен.</p>';
                // ----------------------------------

                let authorHTML = '';
                if (data.author) { // В базе поле называется author
                    authorHTML = `<span>Автор: <a href="#" class="author-link">${data.author}</a></span>`;
                }

                articleBox.innerHTML = `
                    <article>
                        <div style="margin-bottom: 20px;">
                            <a href="/kemerovo42-site/index.html" style="color: var(--accent); text-decoration: none; font-weight: 600;">
                                <i class="fas fa-arrow-left"></i> Назад к новостям
                            </a>
                        </div>
                        
                        <h1 style="font-family: 'Montserrat'; font-size: 2.5rem; margin-bottom: 15px; line-height: 1.2;">${data.title || 'Без названия'}</h1>
                        
                        <div style="display: flex; gap: 20px; margin-bottom: 25px; color: var(--text-muted); font-size: 0.9rem; flex-wrap: wrap;">
                            <span><i class="far fa-clock"></i> ${dateStr}</span>
                            <span><i class="far fa-eye"></i> ${viewsCount} просмотров</span>
                            ${authorHTML}
                        </div>

                        ${data.image ? `<img src="${data.image}" style="width: 100%; max-height: 500px; object-fit: cover; border-radius: 12px; margin-bottom: 25px;" onclick="openLightbox(0)">` : ''}

                        <div class="article-text">${DOMPurify.sanitize(articleContent)}</div>

                        ${galleryHTML}

                        <div class="action-buttons">
                            <button class="like-btn" onclick="toggleLike()">
                                <i class="far fa-heart" id="like-icon"></i>
                                <span id="like-count">${data.likes || 0}</span>
                            </button>
                            <button class="save-btn" onclick="toggleSave()">
                                <i class="far fa-bookmark" id="save-icon"></i>
                                <span id="save-text">Сохранить</span>
                            </button>
                            <button class="btn-action" onclick="shareArticle()">
                                <i class="fas fa-share-alt"></i> Поделиться
                            </button>
                            <button class="btn-action btn-edit-article" id="edit-btn" style="display: none;" onclick="editArticle()">
                                <i class="fas fa-edit"></i> Редактировать
                            </button>
                        </div>

                        <div class="comments-section">
                            <h3><i class="fas fa-comments"></i> Комментарии</h3>
                            <div id="comments-container">
                                <p style="color: var(--text-muted);">Загрузка комментариев...</p>
                            </div>
                            
                            <div class="comment-form" id="comment-form" style="display: none;">
                                <textarea id="comment-text" placeholder="Напишите комментарий..."></textarea>
                                <button onclick="postComment()"><i class="fas fa-paper-plane"></i> Отправить</button>
                            </div>
                        </div>
                    </article>
                `;

                // Проверяем админа и загружаем комментарии
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        const token = await user.getIdTokenResult();
                        if (token.claims.admin) {
                            document.getElementById('edit-btn').style.display = 'inline-flex';
                        }
                        document.getElementById('comment-form').style.display = 'flex';
                        checkUserInteraction(user.uid);
                    }
                });

                loadComments();
            } catch (error) {
                console.error("Ошибка загрузки статьи:", error);
                articleBox.innerHTML = '<p style="text-align:center; padding: 40px; color: #e74c3c;">Ошибка загрузки статьи</p>';
            }
        }

        function formatDateTime(timestamp) {
            if (!timestamp || !timestamp.seconds) return 'Дата не указана';
            const utcDate = new Date(timestamp.seconds * 1000);
            const kDate = new Date(utcDate.getTime() + (7 * 60 * 60 * 1000));
            return `${kDate.toISOString().slice(0, 10).split('-').reverse().join('.')} ${kDate.toISOString().slice(11, 16)}`;
        }

        async function checkUserInteraction(uid) {
            try {
                const userDoc = await getDoc(doc(db, "users", uid));
                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    const savedArticles = userData.savedArticles || [];
                    const likedArticles = userData.likedArticles || [];

                    if (savedArticles.includes(articleId)) {
                        document.getElementById('save-icon').className = 'fas fa-bookmark';
                        document.getElementById('save-text').innerText = 'Сохранено';
                    }
                    if (likedArticles.includes(articleId)) {
                        document.getElementById('like-icon').className = 'fas fa-heart';
                        document.getElementById('like-icon').style.color = '#ef4444';
                    }
                }
            } catch (e) { console.error(e); }
        }

        window.toggleLike = async function() {
            if (!currentUser) {
                showToast("Войдите, чтобы ставить лайки", 'info');
                return;
            }

            const likeIcon = document.getElementById('like-icon');
            const likeCount = document.getElementById('like-count');
            const isLiked = likeIcon.className.includes('fas');

            try {
                if (isLiked) {
                    await updateDoc(doc(db, "news", articleId), { likes: increment(-1) });
                    await updateDoc(doc(db, "users", currentUser.uid), { likedArticles: arrayRemove(articleId) });
                    likeIcon.className = 'far fa-heart';
                    likeIcon.style.color = '';
                    likeCount.innerText = parseInt(likeCount.innerText) - 1;
                } else {
                    await updateDoc(doc(db, "news", articleId), { likes: increment(1) });
                    await updateDoc(doc(db, "users", currentUser.uid), { likedArticles: arrayUnion(articleId) });
                    likeIcon.className = 'fas fa-heart';
                    likeIcon.style.color = '#ef4444';
                    likeCount.innerText = parseInt(likeCount.innerText) + 1;
                }
            } catch (e) {
                showToast("Ошибка", 'error');
            }
        };

        window.toggleSave = async function() {
            if (!currentUser) {
                showToast("Войдите, чтобы сохранять статьи", 'info');
                return;
            }

            const saveIcon = document.getElementById('save-icon');
            const saveText = document.getElementById('save-text');
            const isSaved = saveIcon.className.includes('fas');

            try {
                if (isSaved) {
                    await updateDoc(doc(db, "users", currentUser.uid), { savedArticles: arrayRemove(articleId) });
                    saveIcon.className = 'far fa-bookmark';
                    saveText.innerText = 'Сохранить';
                    showToast("Удалено из сохраненных", 'info');
                } else {
                    await updateDoc(doc(db, "users", currentUser.uid), { savedArticles: arrayUnion(articleId) });
                    saveIcon.className = 'fas fa-bookmark';
                    saveText.innerText = 'Сохранено';
                    showToast("Добавлено в сохраненные", 'success');
                }
            } catch (e) {
                showToast("Ошибка", 'error');
            }
        };

        window.shareArticle = function() {
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({
                    title: currentArticle.title,
                    url: url
                });
            } else {
                navigator.clipboard.writeText(url);
                showToast("Ссылка скопирована!", 'success');
            }
        };

        window.editArticle = function() {
            window.location.href = `/kemerovo42-site/admin/edit-article.html?id=${articleId}`;
        };

        function loadComments() {
            const commentsContainer = document.getElementById('comments-container');
            const q = query(collection(db, "news", articleId, "comments"), orderBy("date", "desc"));
            
            onSnapshot(q, (snapshot) => {
                if (snapshot.empty) {
                    commentsContainer.innerHTML = '<p style="color: var(--text-muted); padding: 20px; text-align: center;">Пока нет комментариев. Будьте первым!</p>';
                    return;
                }

                commentsContainer.innerHTML = '';
                snapshot.forEach(docSnap => {
                    const comment = docSnap.data();
                    const dateStr = formatDateTime(comment.date);
                    
                    commentsContainer.innerHTML += `
                        <div class="comment-item">
                            <div class="comment-header">
                                <span class="comment-author">${comment.authorName || 'Аноним'}</span>
                                <span>${dateStr}</span>
                            </div>
                            <div class="comment-text">${comment.text}</div>
                            ${currentUser ? `<button class="btn-del-comment" onclick="deleteComment('${docSnap.id}')"><i class="fas fa-trash"></i> Удалить</button>` : ''}
                        </div>
                    `;
                });
            });
        }

        window.postComment = async function() {
            if (!currentUser) {
                showToast("Войдите, чтобы комментировать", 'info');
                return;
            }

            const text = document.getElementById('comment-text').value.trim();
            if (!text) {
                showToast("Введите текст комментария", 'error');
                return;
            }

            try {
                const userDoc = await getDoc(doc(db, "users", currentUser.uid));
                const userName = userDoc.exists() ? userDoc.data().displayName : currentUser.email.split('@')[0];

                await addDoc(collection(db, "news", articleId, "comments"), {
                    text: text,
                    authorId: currentUser.uid,
                    authorName: userName,
                    date: serverTimestamp()
                });

                document.getElementById('comment-text').value = '';
                showToast("Комментарий добавлен!", 'success');
            } catch (e) {
                showToast("Ошибка отправки", 'error');
            }
        };

        window.deleteComment = function(commentId) {
            showConfirm("Удалить комментарий?", "Это действие нельзя отменить.", async () => {
                try {
                    await deleteDoc(doc(db, "news", articleId, "comments", commentId));
                    showToast("Комментарий удален", 'success');
                } catch (e) {
                    showToast("Ошибка удаления", 'error');
                }
            });
        };

        // Лайтбокс для галереи
        window.openLightbox = function(index) {
            currentImageIndex = index;
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightbox-img');
            const counter = document.getElementById('lightbox-counter');
            
            lightboxImg.src = galleryImages[index];
            counter.innerText = `${index + 1} / ${galleryImages.length}`;
            lightbox.classList.add('active');
        };

        window.closeLightbox = function() {
            document.getElementById('lightbox').classList.remove('active');
        };

        window.changeLightboxImage = function(direction) {
            currentImageIndex += direction;
            if (currentImageIndex < 0) currentImageIndex = galleryImages.length - 1;
            if (currentImageIndex >= galleryImages.length) currentImageIndex = 0;
            
            document.getElementById('lightbox-img').src = galleryImages[currentImageIndex];
            document.getElementById('lightbox-counter').innerText = `${currentImageIndex + 1} / ${galleryImages.length}`;
        };

        // Кнопка "Наверх"
        const scrollTopBtn = document.getElementById('scroll-top-btn');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                scrollTopBtn.style.display = 'block';
            } else {
                scrollTopBtn.style.display = 'none';
            }
        });
        scrollTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        loadArticle();
    </script>
</body>
</html>
