<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Предложить новость | Кемерово 42</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .suggest-container { max-width: 600px; margin: 50px auto; background: var(--card-bg); padding: 40px; border-radius: var(--border-radius); box-shadow: var(--shadow-md); }
        .suggest-container h1 { font-family: 'Montserrat'; margin-bottom: 10px; }
        .suggest-container p { color: var(--text-muted); margin-bottom: 25px; font-size: 0.95rem; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
        .form-control { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 1rem; transition: 0.2s; }
        .form-control:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2); }
        .btn-submit { width: 100%; padding: 14px; background: var(--accent); color: #0f172a; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-submit:hover { background: #b8962e; }
    </style>
</head>
<body>

    <div id="header-container"></div>

    <div class="suggest-container">
        <h1>Предложить новость</h1>
        <p>Есть интересная новость? Отправьте её нашей редакции! Если она нам понравится, мы её опубликуем.</p>
        
        <form id="suggest-form">
            <div class="form-group">
                <label>Ваше имя (или никнейм)</label>
                <input type="text" id="suggest-author" class="form-control" placeholder="Например: Иван Иванов" required>
            </div>
            <div class="form-group">
                <label>Заголовок новости</label>
                <input type="text" id="suggest-title" class="form-control" placeholder="О чём новость?" required>
            </div>
            <div class="form-group">
                <label>Текст новости</label>
                <textarea id="suggest-text" class="form-control" rows="6" placeholder="Расскажите подробности..." required></textarea>
            </div>
            <button type="submit" class="btn-submit"><i class="fas fa-paper-plane"></i> Отправить в редакцию</button>
        </form>
    </div>

    <script type="module">
        import { renderHeader } from './header.js';
        import { db } from './firebase-config.js'; // <-- БЕРЕМ ГОТОВЫЕ!
        import { showToast } from './ui.js';
        import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        renderHeader();

        document.getElementById('suggest-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const author = document.getElementById('suggest-author').value.trim();
            const title = document.getElementById('suggest-title').value.trim();
            const text = document.getElementById('suggest-text').value.trim();
            const btn = e.target.querySelector('button');

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Отправка...';
            btn.disabled = true;

            try {
                await addDoc(collection(db, "suggestions"), {
                    author: author,
                    title: title,
                    text: text,
                    date: serverTimestamp(),
                    status: 'new'
                });
                showToast("Спасибо! Ваша новость отправлена в редакцию.", 'success');
                document.getElementById('suggest-form').reset();
            } catch (error) {
                console.error(error);
                showToast("Ошибка отправки. Попробуйте позже.", 'error');
            } finally {
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Отправить в редакцию';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
