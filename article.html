<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статья | Кемерово 42</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="header-container"></div>

    <div class="article-container" id="article-box"><p>Загрузка...</p></div>

    <script type="module">
        import { renderHeader } from './main/header.js';
        import { firebaseConfig } from './firebase-config.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        renderHeader(); // Рисуем шапку

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const newsId = new URLSearchParams(window.location.search).get('id');
        const articleBox = document.getElementById('article-box');

        function escapeHTML(str) {
            if (!str) return '';
            return str.toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function formatDateTime(timestamp) {
            if (!timestamp || !timestamp.seconds) return 'Дата не указана';
            const date = new Date(timestamp.seconds * 1000);
            const kD = new Date(date.getTime() + (7 * 60 * 60 * 1000));
            const mD = new Date(date.getTime() + (3 * 60 * 60 * 1000));
            return `${kD.toLocaleDateString('ru-RU')} ${kD.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})} <span style="font-size:0.85em; color:#94a3b8; margin-left:5px;">(МСК ${mD.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})})</span>`;
        }

        if (!newsId) {
            articleBox.innerHTML = '<h1>Статья не найдена</h1><a href="index.html" class="back-btn">На главную</a>';
        } else {
            async function loadArticle() {
                try {
                    const docRef = doc(db, "news", newsId);
                    const docSnap = await getDoc(docRef);
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        updateDoc(docRef, { views: increment(1) }).catch(() => {});
                        let dateStr = formatDateTime(data.date);
                        const imgSrc = data.image || 'https://images.unsplash.com/photo-1590059352802-2c47e8b3f980';
                        
                        articleBox.innerHTML = `
                            <h1 class="article-title">${escapeHTML(data.title)}</h1>
                            <div class="article-meta">
                                <span class="tag">${escapeHTML(data.tag || 'НОВОСТЬ')}</span>
                                <span class="date"><i class="far fa-clock"></i> ${dateStr}</span>
                                <span class="author"><i class="far fa-user"></i> ${escapeHTML(data.author || 'Редакция')}</span>
                            </div>
                            <img src="${escapeHTML(imgSrc)}" class="article-image" onerror="this.src='https://images.unsplash.com/photo-1585829365295-ab7cd400c167'">
                            <div class="article-text">${data.text}</div>
                            <a href="index.html" class="back-btn">← Назад</a>
                        `;
                    } else {
                        articleBox.innerHTML = '<h1>Новость удалена</h1><a href="index.html" class="back-btn">На главную</a>';
                    }
                } catch (error) { articleBox.innerHTML = '<h1>Ошибка загрузки</h1>'; }
            }
            loadArticle();
        }
    </script>
</body>
</html>
