<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статья | Кемерово 42</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">
                <a href="index.html" style="text-decoration: none; color: white;">
                    <h1>КЕМЕРОВО <span>42</span></h1>
                </a>
            </div>
            <button id="theme-toggle"><i class="fas fa-moon"></i> Тёмная тема</button>
        </div>
    </header>

    <div class="article-container" id="article-box">
        <p>Загрузка...</p>
    </div>

    <script type="module">
        import { firebaseConfig } from './firebase-config.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const newsId = urlParams.get('id');
        const articleBox = document.getElementById('article-box');

        function escapeHTML(str) {
            if (!str) return '';
            return str.toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        if (!newsId) {
            articleBox.innerHTML = '<h1>Ошибка: Статья не найдена</h1><a href="index.html" class="back-btn">На главную</a>';
        } else {
            async function loadArticle() {
                try {
                    const docRef = doc(db, "news", newsId);
                    const docSnap = await getDoc(docRef);

                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        
                        // Считаем просмотры
                        updateDoc(docRef, { views: increment(1) }).catch(() => {});

                        let dateStr = 'Дата не указана';
                        if (data.date && data.date.seconds) {
                            dateStr = new Date(data.date.seconds * 1000).toLocaleDateString('ru-RU');
                        }

                        const imgSrc = data.image || 'https://images.unsplash.com/photo-1590059352802-2c47e8b3f980';
                        
                        articleBox.innerHTML = `
                            <h1 class="article-title">${escapeHTML(data.title)}</h1>
                            <div class="article-meta">
                                <span class="tag">${escapeHTML(data.tag || 'НОВОСТЬ')}</span>
                                <span class="date"><i class="far fa-clock"></i> ${dateStr}</span>
                                <span class="author"><i class="far fa-user"></i> ${escapeHTML(data.author || 'Редакция')}</span>
                            </div>
                            <img src="${escapeHTML(imgSrc)}" class="article-image" onerror="this.src='https://images.unsplash.com/photo-1585829365295-ab7cd400c167'">
                            <div class="article-text">${data.text}</div>
                            <a href="index.html" class="back-btn">← Назад</a>
                        `;
                    } else {
                        articleBox.innerHTML = '<h1>Новость удалена</h1><a href="index.html" class="back-btn">На главную</a>';
                    }
                } catch (error) {
                    articleBox.innerHTML = '<h1>Ошибка загрузки статьи</h1>';
                }
            }
            loadArticle();
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
