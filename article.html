<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статья | Кемерово 42</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo">
                <a href="index.html" style="text-decoration: none; color: white;">
                    <h1>КЕМЕРОВО <span>42</span></h1>
                </a>
            </div>
            <button id="theme-toggle"><i class="fas fa-moon"></i> Тёмная тема</button>
        </div>
    </header>

    <div class="article-container" id="article-box">
        <p>Загрузка...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ТОТ ЖЕ КОНФИГ, ЧТО И В index.html
        const firebaseConfig = {
            apiKey: "AIzaSyAtQiA2YnMurhbJ7_tlA6VgOGvTI6x3Cp8",
            authDomain: "kemerovo-42-4ba67.firebaseapp.com",
            projectId: "kemerovo-42-4ba67",
            storageBucket: "kemerovo-42-4ba67.firebasestorage.app",
            messagingSenderId: "664125425786",
            appId: "1:664125425786:web:80e9d5de247952eaaf13c3",
            measurementId: "G-HCE9BTKC5V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const newsId = urlParams.get('id');
        const articleBox = document.getElementById('article-box');

        if (!newsId) {
            articleBox.innerHTML = '<h1>Ошибка: Статья не найдена</h1><a href="index.html" class="back-btn">На главную</a>';
        } else {
            async function loadArticle() {
                const docRef = doc(db, "news", newsId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const dateStr = new Date(data.date.seconds * 1000).toLocaleDateString('ru-RU');
                    const imgSrc = data.image || 'https://images.unsplash.com/photo-1590059352802-2c47e8b3f980';
                    
                    articleBox.innerHTML = `
                        <h1 class="article-title">${data.title}</h1>
                        <div class="article-meta">
                            <span class="tag">${data.tag || 'НОВОСТЬ'}</span>
                            <span class="date"><i class="far fa-clock"></i> ${dateStr}</span>
                            <span class="author"><i class="far fa-user"></i> ${data.author || 'Редакция'}</span>
                        </div>
                        <img src="${imgSrc}" class="article-image">
                        <div class="article-text">
                            <p>${data.text.replace(/\n/g, '</p><p>')}</p>
                        </div>
                        <a href="index.html" class="back-btn">← Назад</a>
                    `;
                } else {
                    articleBox.innerHTML = '<h1>Новость удалена или не существует</h1>';
                }
            }
            loadArticle();
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
